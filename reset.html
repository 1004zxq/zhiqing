<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刷新枝下青</title>
<body style="font:15px/1.7 system-ui,sans-serif;padding:24px;color:#23433a">
<p>正在刷新枝下青…</p>
<p>如果没自动跳转，<a href="./?v=16">点这里</a>。</p>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(reg => reg.scope.includes('/zhiqing/')).map(reg => reg.unregister()));
    }
  } catch (error) {}
  try {
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(key => key.startsWith('zhiqing-static-')).map(key => caches.delete(key)));
    }
  } catch (error) {}
  location.replace('./?v=16&fresh=' + Date.now());
})();
</script>
</body>
</html>
