<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5f2ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="枝下青">
<title>枝下青</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --paper: #f5f2ec;
    --paper-2: #fbf9f4;
    --topbar: rgba(245, 242, 236, .96);
    --ink: #23261f;
    --ink-2: #4d5148;
    --muted: #85887e;
    --line: #e2ddd1;
    --line-strong: #cbc5b7;
    --accent: #2f5d57;
    --accent-2: #3f756d;
    --accent-soft: #e2ece8;
    --on-accent: #fbf9f4;
    --danger: #9a4f45;
    --wash: rgba(47, 93, 87, .07);
    --grain: rgba(60, 65, 58, .06);
    --shadow: 0 18px 50px rgba(35, 40, 32, .14);
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif;
  }

  html[data-theme="dark"] {
    --paper: #141715;
    --paper-2: #1b1f1c;
    --topbar: rgba(20, 23, 21, .96);
    --ink: #e9e7df;
    --ink-2: #c4c8be;
    --muted: #93978d;
    --line: #2c322d;
    --line-strong: #414942;
    --accent: #8fbdb3;
    --accent-2: #a6ccc3;
    --accent-soft: #22312d;
    --on-accent: #10201c;
    --danger: #d18b7f;
    --wash: rgba(143, 189, 179, .06);
    --grain: rgba(225, 230, 220, .05);
    --shadow: 0 18px 50px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--paper); }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--paper);
    background-image: radial-gradient(1000px 520px at 50% -8%, var(--wash), transparent 70%);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    overscroll-behavior-y: contain;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(var(--grain) .7px, transparent .7px);
    background-size: 5px 5px;
    opacity: .55;
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- top ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) 18px 10px;
    background: var(--topbar);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px;
    color: var(--accent);
    flex: 0 0 auto;
  }
  .brand-name {
    font-family: var(--serif);
    font-size: 20px;
    line-height: 1.1;
    letter-spacing: .08em;
  }
  .brand-sub {
    margin-top: 3px;
    font-size: 9.5px;
    line-height: 1;
    color: var(--muted);
    letter-spacing: .24em;
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .save-dot {
    font-size: 10px;
    color: var(--accent);
    letter-spacing: .08em;
    opacity: .78;
    transition: color .2s, opacity .2s;
    white-space: nowrap;
  }
  .save-dot[data-state="pending"] { opacity: 1; color: var(--muted); }
  .save-dot[data-state="error"] { opacity: 1; color: var(--danger); }
  .icon-btn {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--paper-2);
    color: var(--ink-2);
    padding: 0;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- layout ---------- */
  .main {
    flex: 1;
    padding: 6px 16px calc(92px + env(safe-area-inset-bottom));
  }
  .view { display: none; }
  .view.active { display: block; animation: rise .24s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin: 10px 2px 16px;
  }
  .page-title {
    margin: 0;
    font-family: var(--serif);
    font-size: 27px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .page-sub {
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: .02em;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 7px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--paper-2);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .btn.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
  }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: var(--line); }
  .link-btn {
    border: 0;
    background: none;
    color: var(--accent);
    font-size: 12px;
    padding: 4px 0;
    white-space: nowrap;
  }
  .empty {
    padding: 30px 16px;
    border: 1px dashed var(--line-strong);
    border-radius: 16px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    line-height: 1.8;
  }
  .loading { padding: 54px 0; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .2em; }
  .hint { margin: 8px 4px 0; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  .foot-line {
    margin: 28px 0 10px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: .14em;
    color: var(--muted);
  }

  /* ---------- today ---------- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    margin-bottom: 10px;
  }
  .date-center {
    position: relative;
    min-width: 0;
    padding: 3px 14px 4px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
  }
  .date-center:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .date-picker-native {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .date-main {
    display: block;
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.3;
    letter-spacing: .03em;
    font-variant-numeric: tabular-nums;
  }
  .date-sub { display: block; margin-top: 1px; font-size: 10.5px; color: var(--muted); letter-spacing: .08em; }
  .date-btn {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink-2);
    padding: 0;
  }
  .date-btn svg { width: 17px; height: 17px; }
  .back-today { display: block; margin: -2px auto 12px; font-size: 12px; }
  .glance {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 6px 9px 13px;
    border: 1px dashed var(--line-strong);
    border-radius: 14px;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .glance b { color: var(--ink-2); font-weight: 500; }
  .glance .link-btn { margin-left: auto; padding-right: 8px; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; margin: 0 3px 14px; }
  .progress-track { flex: 1; height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .progress-text { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .group { margin-bottom: 15px; }
  .group-head { display: flex; align-items: center; gap: 8px; margin: 0 5px 7px; }
  .group-name { font-size: 10.5px; letter-spacing: .18em; color: var(--muted); white-space: nowrap; }
  .group-line { flex: 1; height: 1px; background: var(--line); }
  .group-count { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card-list {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    overflow: hidden;
  }
  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .card-row:last-child { border-bottom: 0; }
  .check {
    flex: 0 0 auto;
    width: 23px; height: 23px;
    margin-top: 1px;
    display: grid; place-items: center;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    background: transparent;
    padding: 0;
    transition: background .18s, border-color .18s;
  }
  .check svg { width: 13px; height: 13px; color: var(--on-accent); opacity: 0; transform: scale(.6); transition: opacity .18s, transform .18s; }
  .card-row.done .check { background: var(--accent); border-color: var(--accent); }
  .card-row.done .check svg { opacity: 1; transform: none; }
  .card-main { flex: 1; min-width: 0; }
  .card-name {
    display: block;
    width: 100%;
    border: 0;
    background: none;
    padding: 1px 0 0;
    text-align: left;
    font-size: 15.5px;
    line-height: 1.4;
    color: var(--ink);
  }
  .card-row.done .card-name { color: var(--ink-2); }
  .detail-input {
    display: block;
    width: 100%;
    margin-top: 7px;
    padding: 3px 0 3px;
    border: 0;
    border-bottom: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-2);
    font-size: 13px;
    outline: none;
  }
  .detail-input::placeholder { color: var(--muted); opacity: .7; }
  .detail-input:focus { border-bottom-color: var(--accent); }

  /* ---------- todos ---------- */
  .todo-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .todo-input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--paper-2);
    outline: none;
    font-size: 15px;
  }
  .todo-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .todo-add-btn {
    flex: 0 0 auto;
    width: 44px;
    padding: 0;
    border: 1px solid var(--accent);
    border-radius: 14px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 22px;
  }
  .todo-list {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    overflow: hidden;
  }
  .todo-row {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 12px 10px 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .todo-row:last-child { border-bottom: 0; }
  .todo-row.done .check { background: var(--accent); border-color: var(--accent); }
  .todo-row.done .check svg { opacity: 1; transform: none; }
  .todo-row.done .todo-title { color: var(--muted); text-decoration: line-through; }
  .todo-main { flex: 1; min-width: 0; }
  .todo-title {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    text-align: left;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .todo-note { margin-top: 3px; color: var(--muted); font-size: 11.5px; white-space: pre-wrap; }
  .todo-delete {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
  }
  .todo-delete svg { width: 15px; height: 15px; }
  .legacy-record {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    margin-top: 9px;
    padding: 9px 12px;
    border: 1px dashed var(--line-strong);
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    text-align: left;
    font-size: 11.5px;
  }

  .note-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 5px 8px; }
  .note-label { font-size: 10.5px; letter-spacing: .18em; color: var(--muted); }
  .today-notes { display: grid; gap: 8px; }
  .today-note-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: start;
    gap: 12px;
    width: 100%;
    padding: 13px 15px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    color: var(--ink);
    text-align: left;
  }
  .today-note-row:active { border-color: var(--line-strong); }
  .today-note-type { padding-top: 2px; color: var(--accent); font-size: 10.5px; letter-spacing: .12em; }
  .today-note-preview {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .today-note-preview.empty { color: var(--muted); }

  /* ---------- diary ---------- */
  .search {
    display: block;
    width: 100%;
    margin-bottom: 13px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-2);
    color: var(--ink);
    font-size: 14px;
    outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .entry {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    text-align: left;
  }
  .entry:active { border-color: var(--line-strong); }
  .entry-date { margin-bottom: 5px; font-size: 10.5px; color: var(--muted); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .entry-excerpt {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.75;
    white-space: pre-wrap;
  }

  /* ---------- segmented ---------- */
  .segmented {
    display: flex;
    gap: 3px;
    padding: 4px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-2);
  }
  .segmented button {
    flex: 1;
    min-height: 34px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    padding: 6px 10px;
  }
  .segmented button.active { background: var(--accent); color: var(--on-accent); }

  /* ---------- sleep ---------- */
  .sleep-card {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    text-align: left;
  }
  .sleep-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sleep-label { font-family: var(--serif); font-size: 16.5px; font-variant-numeric: tabular-nums; }
  .sleep-badge { flex: 0 0 auto; font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 9px; }
  .sleep-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 12px; margin-top: 8px; font-size: 12px; }
  .sleep-grid span { color: var(--muted); }
  .sleep-grid b { font-weight: 500; color: var(--ink-2); }

  /* ---------- settings ---------- */
  .section { margin-bottom: 23px; }
  .section-title { margin: 0 5px 9px; font-size: 10.5px; letter-spacing: .18em; color: var(--muted); }
  .panel { border: 1px solid var(--line); border-radius: 16px; background: var(--paper-2); overflow: hidden; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 13px 16px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    text-align: left;
  }
  .setting-row:last-child { border-bottom: 0; }
  .setting-row .label { display: block; font-size: 14px; line-height: 1.4; }
  .setting-row .desc { display: block; margin-top: 2px; font-size: 11px; line-height: 1.5; color: var(--muted); }
  .action-row { cursor: pointer; }
  .action-row:active { background: var(--accent-soft); }
  .chev { flex: 0 0 auto; font-size: 11.5px; color: var(--accent); }
  .cat-block { border-bottom: 1px solid var(--line); }
  .cat-block:last-of-type { border-bottom: 0; }
  .cat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 16px 7px;
    background: var(--paper);
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .16em;
  }
  .card-setting { padding-top: 10px; padding-bottom: 10px; }
  .row-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .mini {
    min-height: 30px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--paper);
    color: var(--ink-2);
    font-size: 11.5px;
  }
  .mini.danger { color: var(--danger); }
  .add-card-row { justify-content: center; }
  .add-card-row .btn { width: 100%; }
  .segmented.small { margin: 0; padding: 3px; flex: 0 0 auto; }
  .segmented.small button { min-height: 28px; padding: 5px 10px; font-size: 11.5px; }
  .danger .label, .setting-row.danger .label { color: var(--danger); }
  .save-health .save-state {
    flex: 0 0 auto;
    color: var(--accent);
    font-size: 11.5px;
  }
  .save-health .save-state[data-state="error"] { color: var(--danger); }
  .cloud-state { flex: 0 0 auto; color: var(--accent); font-size: 11.5px; }
  .cloud-state[data-state="error"], .cloud-state[data-state="conflict"] { color: var(--danger); }
  .cloud-state[data-state="offline"], .cloud-state[data-state="pending"] { color: var(--muted); }
  .history-list { display: grid; gap: 8px; }
  .history-item {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    text-align: left;
  }
  .history-item b { display: block; font-size: 13px; font-weight: 500; }
  .history-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
  .archived-mark { margin-left: 6px; color: var(--muted); font-size: 9.5px; letter-spacing: .08em; }
  .card-name .history-arrow { margin-left: 5px; color: var(--muted); font-size: 12px; }
  .card-row.archived .check { opacity: .35; }

  /* ---------- ruqi chat ---------- */
  #view-ruqi.active { display: flex; flex-direction: column; min-height: calc(100dvh - 176px); }
  .ruqi-head { margin-bottom: 12px; }
  .ruqi-intro {
    padding: 11px 13px;
    border: 1px dashed var(--line-strong);
    border-radius: 13px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.65;
  }
  .ruqi-messages { flex: 1; display: grid; gap: 10px; align-content: start; padding-bottom: 12px; }
  .ruqi-bubble {
    max-width: 88%;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    font-size: 14px;
    line-height: 1.72;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .ruqi-bubble.user {
    justify-self: end;
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
  }

<script>
(() => {
  'use strict';

  const SEED = {"version":2,"updatedAt":0,"createdAt":"2026-10-29","settings":{"theme":"auto"},"cards":[{"id":"anchor_zitie","category":"锚点卡","name":"字帖"},{"id":"anchor_tingge","category":"锚点卡","name":"听歌"},{"id":"explore_soft","category":"探索卡","name":"软件"},{"id":"explore_hard","category":"探索卡","name":"硬件"},{"id":"build_struct","category":"建设卡","name":"结构力学"},{"id":"build_read","category":"建设卡","name":"阅读"},{"id":"ice_listen","category":"破冰卡","name":"听力"},{"id":"ice_write","category":"破冰卡","name":"作文"},{"id":"ice_translate","category":"破冰卡","name":"翻译"},{"id":"ice_speak","category":"破冰卡","name":"口语"},{"id":"push_vocab","category":"推进卡","name":"词库"},{"id":"expr_water","category":"表达卡","name":"水彩"},{"id":"expr_oil","category":"表达卡","name":"油画棒"},{"id":"expr_film","category":"表达卡","name":"电影"}],"days":{},"sleep":[]};
  const STORE = 'zhiqing.v1';
  const VERSION = 2;
  const DB_NAME = 'zhiqing.storage';
  const DB_VERSION = 1;
  const SNAPSHOT_LIMIT = 24;
  const SNAPSHOT_GAP = 60 * 1000;
  const CLOUD_CONFIG_KEY = 'zhiqing.cloud.v1';
  const CLOUD_DIRTY_KEY = 'zhiqing.cloud.dirty';
  const RUQI_KEY_KEY = 'zhiqing.ruqi.key';
    const CLOUD_DEFAULT_URL = 'https://43.143.82.198';
  const RUQI_HISTORY_LIMIT = 40;
  const RUQI_SEALED_URL = './ruqi-sealed.json';
  const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const NOTE_TYPES = [
    { key: 'output', label: '输出', hint: '主动写的文字', unit: '篇', placeholder: '主动写的文字。想法、一段话、一首歌…', empty: '主动写的文字，写一段就存下来。' },
    { key: 'daily', label: '日常', hint: '今天发生了什么', unit: '篇', placeholder: '今天发生了什么。', empty: '今天发生了什么，写一句也算。' },
    { key: 'quote', label: '摘录', hint: '碰到的喜欢的句子', unit: '条', placeholder: '碰到的喜欢的句子。可以顺手写下来源。', empty: '碰到喜欢的句子，就记下来。' }
  ];
  const emptyNotes = () => ({ output: '', daily: '', quote: '' });
  const noteText = (day, type) => (day && day.notes && typeof day.notes[type] === 'string') ? day.notes[type] : '';
  const hasAnyNote = day => !!(day && day.notes && Object.values(day.notes).some(v => (v || '').trim()));
  const API = false ? (() => {
    try {
      return (location.protocol === 'http:' || location.protocol === 'https:') ? '/api/data' : null;
    } catch (e) {
      return null;
    }
  })() : null;

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
    chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>'
  };

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const pad = n => String(n).padStart(2, '0');
  const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoDate(new Date());
  const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
  const fmtDate = (s, short = false) => { if (!s) return ''; const d = parseISO(s); return short ? `${d.getMonth() + 1}.${d.getDate()}` : `${d.getMonth() + 1}月${d.getDate()}日`; };
  const fmtFull = s => { const d = parseISO(s); return `${d.getMonth() + 1}月${d.getDate()}日 · ${WEEK[d.getDay()]}`; };
  const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoDate(d); };
  const nowStamp = () => { const d = new Date(); return `${isoDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const hasKey = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
  const newId = prefix => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

  // ---------- state ----------
  function normalize(s) {
    const base = clone(SEED);
    s = s && typeof s === 'object' && !Array.isArray(s) ? s : {};
    const sourceCards = Array.isArray(s.cards) ? s.cards : clone(base.cards);
    const cards = [];
    const cardIds = new Set();
    for (const card of sourceCards) {
      if (!card || !card.id || !card.name || !card.category || cardIds.has(card.id)) continue;
      cardIds.add(card.id);
      cards.push(Object.assign({}, card, {
        archived: card.archived === true,
        archivedAt: card.archived === true ? (card.archivedAt || '') : ''
      }));
    }
    for (const card of base.cards) {
      if (!cardIds.has(card.id)) cards.push(clone(card));
    }
    const out = {
      version: VERSION,
      updatedAt: Number(s.updatedAt) || 0,
      createdAt: s.createdAt || base.createdAt,
      settings: Object.assign({ theme: 'auto' }, base.settings || {}, s.settings || {}),
      cards,
      days: s.days && typeof s.days === 'object' && !Array.isArray(s.days) ? s.days : {},
      sleep: Array.isArray(s.sleep) ? s.sleep : clone(base.sleep),
      ruqi: {
        messages: s.ruqi && Array.isArray(s.ruqi.messages)
          ? s.ruqi.messages
            .filter(message => message && (message.role === 'user' || message.role === 'assistant') && String(message.text || '').trim())
            .slice(-RUQI_HISTORY_LIMIT)
            .map(message => ({
              role: message.role,
              text: String(message.text).slice(0, 8000),
              at: typeof message.at === 'string' ? message.at : ''
            }))
          : []
      }
    };
    for (const key of Object.keys(out.days)) {
      const day = out.days[key];
      if (!day || typeof day !== 'object' || Array.isArray(day)) { delete out.days[key]; continue; }
      day.done = day.done && typeof day.done === 'object' && !Array.isArray(day.done) ? day.done : {};
      day.todos = (Array.isArray(day.todos) ? day.todos : []).map((todo, index) => ({
        id: String(todo && todo.id || `todo_${key}_${index}`),
        text: String(todo && todo.text || '').trim().slice(0, 500),
        note: String(todo && todo.note || '').slice(0, 3000),
        done: !!(todo && todo.done),
        createdAt: String(todo && todo.createdAt || ''),
        completedAt: String(todo && todo.completedAt || '')
      })).filter(todo => todo.text);
      const notes = day.notes && typeof day.notes === 'object' && !Array.isArray(day.notes) ? day.notes : {};
      day.notes = {
        output: typeof notes.output === 'string' ? notes.output : '',
        daily: typeof notes.daily === 'string' ? notes.daily : '',
        quote: typeof notes.quote === 'string' ? notes.quote : ''
      };
      // 旧版本的一天一段笔叙，归到「日常」
      if (typeof day.note === 'string' && day.note.trim() && !day.notes.daily.trim()) {
        day.notes.daily = day.note;
      }
      delete day.note;
    }
    out.sleep = out.sleep.filter(s => s && s.id && /^\d{4}-\d{2}-\d{2}$/.test(String(s.date || '')));
    return out;
  }

  function loadState(raw) {
    try {
      if (raw === undefined) raw = localStorage.getItem(STORE);
      if (!raw) return clone(SEED);
      return normalize(JSON.parse(raw));
    } catch (e) {
      console.warn('读取数据失败', e);
      return clone(SEED);
    }
  }

  let storageDbPromise = null;
  let storageWriteChain = Promise.resolve();
  let lastSnapshotAt = 0;
  let lastSnapshotFingerprint = '';
  let saveMeta = { local: false, indexedDb: false, savedAt: 0, text: '已自动保存', kind: 'saved' };
  let currentSaveText = '已自动保存';
  let currentSaveKind = 'saved';
  let cloudConfig = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY) || 'null');
      if (saved && typeof saved.url === 'string' && typeof saved.token === 'string') return saved;
    } catch (e) {}
    return null;
  })();
  let cloudDirty = (() => {
    try { return localStorage.getItem(CLOUD_DIRTY_KEY) === '1'; } catch (e) { return false; }
  })();
  let cloudStatus = { kind: cloudConfig ? 'idle' : 'off', text: cloudConfig ? '等待同步' : '未连接' };
  let cloudSyncPromise = null;
  let cloudSyncTimer = null;
  let applyingCloudState = false;

  function requestResult(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('IndexedDB request failed'));
    });
  }

  function transactionDone(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
    });
  }

  function openStorageDb() {
    if (!('indexedDB' in window)) return Promise.resolve(null);
    if (storageDbPromise) return storageDbPromise;
    storageDbPromise = new Promise((resolve, reject) => {
      let request;
      try {
        request = indexedDB.open(DB_NAME, DB_VERSION);
      } catch (e) {
        reject(e);
        return;
      }
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains('state')) {
          db.createObjectStore('state', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('snapshots')) {
          const snapshots = db.createObjectStore('snapshots', { keyPath: 'id', autoIncrement: true });
          snapshots.createIndex('savedAt', 'savedAt');
        }
      };
      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => db.close();
        resolve(db);
      };
      request.onerror = () => reject(request.error || new Error('IndexedDB open failed'));

  function bytesToBase64Url(bytes) {

    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');

  function base64UrlToBytes(value) {

    return Uint8Array.from(raw, char => char.charCodeAt(0));

  }

  }



  async function decryptCloudState(document, token) {

  function scheduleCloudSync(delay = 2200) {

    if (!cloudConfig || applyingCloudState) return;

    clearTimeout(cloudSyncTimer);

    setCloudStatus(navigator.onLine ? 'pending' : 'offline', navigator.onLine ? '绛夊緟涓婁紶' : '绛夊緟鑱旂綉');

    cloudSyncTimer = setTimeout(() => { void syncCloud(); }, delay);

  }



  async function cloudRequest(config, method, body) {

    const ctrl = new AbortController();

    const timer = setTimeout(() => ctrl.abort(), 9000);

    let response;

    try {

      response = await fetch(`${config.url}/api/sync`, {

        method,

        headers: {

          'Authorization': `Bearer ${config.token}`,

          'Content-Type': 'application/json'

        },

        body: body === undefined ? undefined : JSON.stringify(body),

        cache: 'no-store',

        signal: ctrl.signal

      });

    } finally {

      clearTimeout(timer);

    }

    let payload = {};

    try { payload = await response.json(); } catch (e) {}

    if (!response.ok) {

      const error = new Error(payload.error || `cloud_${response.status}`);

      error.status = response.status;

      error.payload = payload;

      throw error;

    }

    return payload;

  }



  async function uploadCloud(baseRevision) {

    const uploadedAt = state.updatedAt;

    const encrypted = await encryptCloudState(cloudConfig.token);

    const started = Date.now();

    const payload = await cloudRequest(cloudConfig, 'PUT', {

      ...encrypted,

      baseRevision,

      clientUpdatedAt: uploadedAt

    });

    saveCloudConfig({

      ...cloudConfig,

      revision: Number(payload.revision),

      lastSyncAt: started,

      lastServerAt: Number(payload.updatedAt)

    });

    if (state.updatedAt === uploadedAt) setCloudDirty(false);

    else scheduleCloudSync(500);

    return payload;

  }



  async function applyCloudState(remoteState, remote, reason = 'cloud') {

    const incoming = normalize(remoteState);

    applyingCloudState = true;

    try {

      if (storageFingerprint(incoming) !== storageFingerprint(state)) {

        await addSnapshotData(state, `before-${reason}`);

      }

      state = incoming;

      viewDate = todayISO();

      diarySearch = '';

      const json = JSON.stringify(state);

      const localOk = writeLocalCopy(json);

      const indexedDbOk = await writePersistentCopy(json, true);

      saveMeta = { local: localOk, indexedDb: indexedDbOk, savedAt: Date.now(), text: '宸蹭粠浜戠鏇存柊', kind: 'saved' };

      setCloudDirty(false);

      saveCloudConfig({

        ...cloudConfig,

        revision: Number(remote.revision),

        lastSyncAt: Date.now(),

        lastServerAt: Number(remote.updatedAt)

      });

      applyTheme();

      renderAll();

      setSaveStatus('宸蹭粠浜戠鏇存柊', 'saved');

      setCloudStatus('synced', '宸插悓姝?);

    } finally {

      applyingCloudState = false;

    }

  }



  async function syncCloud(options = {}) {

    if (!cloudConfig) return false;

    if (cloudSyncPromise) return cloudSyncPromise;

    cloudSyncPromise = (async () => {

      if (!navigator.onLine) {

        setCloudStatus('offline', '绛夊緟鑱旂綉');

        return false;

      }

      setCloudStatus('syncing', '鍚屾涓€?);

      try {

        let response;

        try {

          response = await cloudRequest(cloudConfig, 'GET');

        } catch (error) {

          if (error.status === 401) {

            setCloudStatus('error', '鍚屾瀵嗛挜涓嶅');

            return false;

          }

          throw error;

        }



        if (response.empty) {

          await uploadCloud(0);

          setCloudStatus('synced', '宸插悓姝?);

          if (options.manual) toast('宸蹭笂浼犲埌浜戠');

          return true;

        }



        const remote = response.document;

        let remoteState;

        try {

          remoteState = await decryptCloudState(remote, cloudConfig.token);

        } catch (e) {

          setCloudStatus('error', '瀵嗛挜鏃犳硶瑙ｅ紑浜戠鏁版嵁');

          return false;

        }



        const remoteChanged = Number(remote.revision) > Number(cloudConfig.revision || 0);

        if (remoteChanged && cloudDirty) {

          await addSnapshotData(remoteState, 'cloud-conflict');

          if ((state.updatedAt || 0) >= Number(remote.clientUpdatedAt)) {

            await uploadCloud(Number(remote.revision));

            setCloudStatus('synced', '宸插悓姝?);

            if (options.manual) toast('宸蹭繚鐣欐湰鏈鸿緝鏂扮殑鍐呭');

          } else if ($('#sheetRoot').classList.contains('open')) {

            setCloudStatus('conflict', '鍏抽棴缂栬緫椤靛悗鏇存柊');

            return false;

          } else {

            await applyCloudState(remoteState, remote, 'conflict');

            if (options.manual) toast('宸查噰鐢ㄤ簯绔緝鏂扮殑鍐呭');

          }

          return true;

        }



        if (remoteChanged && !cloudDirty) {

          if ($('#sheetRoot').classList.contains('open')) {

            setCloudStatus('conflict', '鍏抽棴缂栬緫椤靛悗鏇存柊');

            return false;

          }

          await applyCloudState(remoteState, remote, 'remote');

          if (options.manual) toast('宸蹭粠浜戠鏇存柊');

          return true;

        }



        if (cloudDirty || (state.updatedAt || 0) > Number(remote.clientUpdatedAt)) {

          await uploadCloud(Number(remote.revision));

          setCloudStatus('synced', '宸插悓姝?);

          if (options.manual) toast('宸蹭笂浼犲埌浜戠');

          return true;

        }



        saveCloudConfig({

          ...cloudConfig,

          revision: Number(remote.revision),

          lastSyncAt: Date.now(),

          lastServerAt: Number(remote.updatedAt)

        });

        setCloudDirty(false);

        setCloudStatus('synced', '宸插悓姝?);

        if (options.manual) toast('宸茬粡鏄渶鏂扮増鏈?);

        return true;

      } catch (e) {

        console.warn('浜戝悓姝ュけ璐?, e);

        setCloudStatus(navigator.onLine ? 'error' : 'offline', navigator.onLine ? '绋嶅悗閲嶈瘯' : '绛夊緟鑱旂綉');

        if (options.manual) toast('浜戝悓姝ュけ璐ワ紝鏈満鏁版嵁宸茬粡淇濆瓨');

        return false;

      }

    })().finally(() => {

      cloudSyncPromise = null;

      cloudSyncTimer = null;

    });

    return cloudSyncPromise;

  }



  async function connectCloud(urlValue, token) {

    const url = normalizeCloudUrl(urlValue);

    const cleanToken = String(token || '').trim();

    if (cleanToken.length < 20) throw new Error('鍚屾瀵嗛挜澶煭');

    const config = {

      url,

      token: cleanToken,

      revision: 0,

      lastSyncAt: 0,

      deviceId: newId('device')

    };



    let response;

    try {

      const probe = await fetch(`${url}/api/health`, { cache: 'no-store' });

      if (!probe.ok) throw new Error('鍚庣娌℃湁鍝嶅簲');

      response = await cloudRequest(config, 'GET');

    } catch (e) {

      if (e.status === 401) throw new Error('鍚屾瀵嗛挜涓嶆纭?);

      throw new Error('杩炴帴澶辫触锛岃妫€鏌ュ湴鍧€鍜岀綉缁?);

    }



    if (response.empty) {

      saveCloudConfig(config);

      setCloudDirty(true);

      await syncCloud({ manual: true });

      return;

    }



    const remote = response.document;

    let remoteState;

    try {

      remoteState = await decryptCloudState(remote, cleanToken);

    } catch (e) {

      throw new Error('鍚屾瀵嗛挜鏃犳硶瑙ｅ紑浜戠鏁版嵁');

    }



    const cloudDates = Object.keys(remoteState.days || {}).sort();

    const lastCloudDate = cloudDates[cloudDates.length - 1];

    const useCloud = confirm(

      `浜戠鎵惧埌 ${cloudDates.length} 澶╄褰?{lastCloudDate ? `锛屾渶杩戝埌 ${fmtDate(lastCloudDate)}` : ''}銆俓n\n` +

      '纭畾锛氭妸浜戠璁板綍鎭㈠鍒拌繖鍙版墜鏈篭n鍙栨秷锛氫繚鎸佺幇鐘讹紝涓嶄細鏀瑰姩浜戠'

    );

    if (!useCloud) {

      toast('鏈仮澶嶏紝浜戠鏁版嵁娌℃湁琚敼鍔?);

      return;

    }

    saveCloudConfig({ ...config, revision: Number(remote.revision) });

    await applyCloudState(remoteState, remote, 'connect');

    toast('浜戠璁板綍宸叉仮澶?);

  }

    const theme = resolveTheme();

    document.documentElement.dataset.theme = theme;

    if (meta) meta.setAttribute('content', theme === 'dark' ? '#141715' : '#f5f2ec');

  function getDay(date, create = false) {

    if (!state.days[date]) {

      if (!create) return { done: {}, notes: emptyNotes() };

      state.days[date] = { done: {}, notes: emptyNotes(), todos: [] };

    }

    const day = state.days[date];

    if (!day.notes) day.notes = emptyNotes();

    if (!Array.isArray(day.todos)) day.todos = [];

    return day;

  }

  function cleanupDay(date) {

    const day = state.days[date];

    if (!day) return;

    const hasDone = Object.keys(day.done || {}).length > 0;

    const hasTodos = Array.isArray(day.todos) && day.todos.length > 0;

    if (!hasDone && !hasTodos && !hasAnyNote(day)) delete state.days[date];

  function addTodoForDate(date, text) {

    const day = getDay(date, true);

    day.todos.push({

      text: String(text).trim().slice(0, 500),

      note: '',

      done: false,

      createdAt: nowStamp(),

      completedAt: ''

    saveNow();

    return day.todos[day.todos.length - 1];

  function openDiaryEditor(date, type) {

    const info = NOTE_TYPES.find(t => t.key === type) || NOTE_TYPES[1];

    openSheet({

      body: `

      `,

      actions: [

        {

          label: '瀹屾垚',

          cls: 'btn primary',

          onClick: async () => {

            const chosen = $('#dDate').value || loadedDate;

            const text = $('#dText').value;

            if (!text.trim()) {

              const existing = noteText(state.days[chosen], info.key).trim();

              if (existing) {

                if (!confirm('杩欑瘒鏄┖鐨勶紝瑕佸垹鎺夊悧锛?)) return false;

                getDay(chosen).notes[info.key] = '';

                cleanupDay(chosen);

                await saveNow();

                renderCurrent();

                toast('宸插垹闄?);

                return true;

              }

              toast('娌℃湁鍐呭锛屼笉鏂板');

              return true;

            }

            const day = getDay(chosen, true);

            day.notes[info.key] = text;

            cleanupDay(chosen);

            await saveNow();

            renderCurrent();

            toast('宸茶嚜鍔ㄤ繚瀛?);

            return true;

          }

        }

      ],

      onMount: (root) => {

        const dateInput = $('#dDate');

        const textEl = $('#dText');

        const commitDraft = (chosen = dateInput.value || loadedDate) => {

          const text = textEl.value;

          if (!text.trim()) return false;

          const day = getDay(chosen, true);

          day.notes[info.key] = text;

          cleanupDay(chosen);

          scheduleSave();

          return true;

        };

        textEl.addEventListener('input', () => commitDraft());

        dateInput.addEventListener('change', () => {

          const next = dateInput.value;

          if (!next) return;

          if (textEl.value.trim()) commitDraft(loadedDate);

          loadedDate = next;

          loadedText = noteText(state.days[next], info.key);

          textEl.value = loadedText;

        });

        root.querySelectorAll('[data-move]').forEach(btn => {

          btn.addEventListener('click', async () => {

            const toType = btn.dataset.move;

            const toInfo = NOTE_TYPES.find(t => t.key === toType);

            if (!toInfo) return;

            const chosen = dateInput.value || loadedDate;

            const text = textEl.value;

            if (!text.trim()) { toast('鍏堝啓涓€鐐瑰啀绉?); return; }

            const existing = noteText(state.days[chosen], toType).trim();

            let finalText = text;

            if (existing) {

              if (!confirm(`閭ｅぉ宸茬粡鏈夈€?{toInfo.label}銆嶄簡銆傝鎶婅繖娈垫帴鍦ㄥ悗闈㈠悧锛焋)) return;

              finalText = existing + '\n\n' + text.trim();

            }

            const day = getDay(chosen, true);

            day.notes[toType] = finalText;

            day.notes[info.key] = '';

            cleanupDay(chosen);

            await saveNow();

            diaryType = toType;

            diarySearch = '';

            renderCurrent();

            closeSheet();

            toast(`宸茬Щ鍒般€?{toInfo.label}銆峘);

          });

        });

      }

    });

  }

        saveNow();

      await clearPersistentStorage();

      try { localStorage.removeItem(STORE); } catch (e) {}

      state = loadState();

      viewDate = todayISO();

      diarySearch = '';

      diaryType = 'daily';

      await saveNow({ snapshot: true });

  async function clearPersistentStorage() {

    const db = await openStorageDb();

    if (!db) return;

    try {

      const tx = db.transaction(['state', 'snapshots'], 'readwrite');

      tx.objectStore('state').clear();

      tx.objectStore('snapshots').clear();

      await transactionDone(tx);

      lastSnapshotAt = 0;

      lastSnapshotFingerprint = '';

    } catch (e) {

      console.warn('娓呯┖澶囩敤瀛樺偍澶辫触', e);

  }

  // ---------- sheet ----------

  let lastFocus = null;

  function openSheet({ title, body, actions = [], onMount }) {

    const root = $('#sheetRoot');

    root.innerHTML = `

      <div class="sheet-backdrop" data-close></div>

      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">

        <div class="sheet-head">

          <div class="sheet-title">${esc(title)}</div>

          <button class="icon-btn" data-close aria-label="鍏抽棴">${ICON.x}</button>

        </div>

        <div class="sheet-body">${body}</div>

        <div class="sheet-actions">

          ${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-action="${i}">${esc(a.label)}</button>`).join('')}

        </div>

      </div>

    `;

    root.inert = false;

    root.classList.add('open');

    document.body.classList.add('sheet-open');

    lastFocus = document.activeElement;



    root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));

    actions.forEach((action, i) => {

      const btn = root.querySelector(`[data-action="${i}"]`);

      if (!btn) return;

      btn.addEventListener('click', async () => {

        try {

          const keep = action.onClick ? await action.onClick() : true;

          if (keep !== false) closeSheet();

        } catch (err) {

          console.error(err);

          toast('鍑轰簡鐐归棶棰橈紝鍐嶈瘯涓€娆?);

        }

      });

    });

    if (onMount) onMount(root);

    setTimeout(() => {

      const first = root.querySelector('input:not([type=date]):not([type=file]), textarea, select');

      if (first && !('ontouchstart' in window)) first.focus({ preventScroll: true });

    }, 260);

  }



  function closeSheet() {

    const root = $('#sheetRoot');

    const wasOpen = root.classList.contains('open');

    root.classList.remove('open');

    root.inert = true;

    document.body.classList.remove('sheet-open');

    if (lastFocus && lastFocus.focus) {

      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}

    }

    lastFocus = null;

    if (wasOpen) renderCurrent();

  }

  // ---------- init ----------

  async function init() {

    applyTheme();

    if (navigator.storage && navigator.storage.persist) {

      navigator.storage.persist().catch(() => {});

    }

    $$('.tab').forEach(btn => {

      btn.addEventListener('click', () => switchTab(btn.dataset.tab));

    });

    $('#themeBtn').addEventListener('click', () => {

      const current = resolveTheme();

      state.settings.theme = current === 'dark' ? 'light' : 'dark';

      saveNow();

      applyTheme();

      if (currentTab === 'settings') renderSettings();

    });

    document.addEventListener('keydown', e => {

      if (e.key === 'Escape') closeSheet();

    });

    document.addEventListener('visibilitychange', () => {

      if (document.hidden) flushLocalAndBeacon();

      else if (cloudConfig) void syncCloud();

    });

    window.addEventListener('pagehide', flushLocalAndBeacon);

    window.addEventListener('beforeunload', flushLocalAndBeacon);

    window.addEventListener('online', () => {

      if (cloudConfig) scheduleCloudSync(100);

    });

    window.addEventListener('offline', () => {

      if (cloudConfig) setCloudStatus('offline', '绛夊緟鑱旂綉');

    });

    setInterval(() => {

      if (!document.hidden && cloudConfig && !cloudSyncPromise) void syncCloud();

    }, 60000);



    const hydrated = await hydrateStoredState();

    await syncOnLoad();

    applyTheme();

    switchTab('today');

    if (cloudConfig) scheduleCloudSync(700);



    if (!hadStore && !hydrated) {

      await saveNow({ snapshot: true });

      setTimeout(() => {

        if (!$('#sheetRoot').classList.contains('open')) openWelcome();

      }, 500);

    } else {

      setSaveStatus(currentSaveText, currentSaveKind);

    }

  }



  document.addEventListener('DOMContentLoaded', () => { init(); });

})();
