  function bindSettings() {
    const view = $('#view-settings');
    $('#addCard').addEventListener('click', () => openCardEditor(null));
    view.querySelectorAll('[data-edit-card]').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = state.cards.find(c => c.id === btn.dataset.editCard);
        if (card) openCardEditor(card);
      });
    });
    view.querySelectorAll('[data-del-card]').forEach(btn => {
      btn.addEventListener('click', () => deleteCard(btn.dataset.delCard));
    });
    view.querySelectorAll('[data-restore-card]').forEach(btn => {
      btn.addEventListener('click', () => restoreCard(btn.dataset.restoreCard));
    });
    view.querySelectorAll('#themeSeg [data-theme]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.settings.theme = btn.dataset.theme;
        saveNow();
        applyTheme();
        renderSettings();
      });
    });
    $('#cloudSetup').addEventListener('click', openCloudSetup);
    $('#resetAll').addEventListener('click', async () => {
      if (!confirm('清空全部数据，恢复成初始状态？')) return;
      if (!confirm('真的确定？本机自动存档和全部记录都会一起清空。')) return;
      await clearPersistentStorage();
      try { localStorage.removeItem(STORE); } catch (e) {}
      state = loadState();
      viewDate = todayISO();
      diarySearch = '';
      diaryType = 'daily';
      await saveNow({ snapshot: true });
      applyTheme();
      renderAll();
      toast('已清空，回到初始状态');
    });
  }

  async function clearPersistentStorage() {
    const db = await openStorageDb();
    if (!db) return;
    try {
      const tx = db.transaction(['state', 'snapshots'], 'readwrite');
      tx.objectStore('state').clear();
      tx.objectStore('snapshots').clear();
      await transactionDone(tx);
      lastSnapshotAt = 0;
      lastSnapshotFingerprint = '';
    } catch (e) {
      console.warn('清空备用存储失败', e);
    }
  }

  function openCardEditor(card) {
    const isNew = !card;
    const cats = categoryList();
    openSheet({
      title: isNew ? '添加卡片' : '改卡片',
      body: `
        <div class="field">
          <label>类别</label>
          <input class="input" id="cCat" list="catList" value="${esc(card ? card.category : '')}" placeholder="例如 建设卡">
          <datalist id="catList">${cats.map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist>
        </div>
        <div class="field">
          <label>名字</label>
          <input class="input" id="cName" value="${esc(card ? card.name : '')}" placeholder="例如 结构力学">
        </div>
        <div class="hint sheet-hint">类别可以直接写新的，比如「生活卡」。</div>
      `,
      actions: [
        ...(isNew ? [] : [{
          label: '删除',
          cls: 'btn danger',
          onClick: () => {
            if (!confirm(`把「${card.name}」移出卡片列表？以前的勾选记录会保留。`)) return false;
            archiveCardData(card.id);
            saveNow();
            renderSettings();
            toast('已移出列表，历史已保留');
            return true;
          }
        }]),
        {
          label: '保存',
          cls: 'btn primary',
          onClick: () => {
            const category = $('#cCat').value.trim();
            const name = $('#cName').value.trim();
            if (!category || !name) { toast('类别和名字都要写'); return false; }
            if (isNew) {
              state.cards.push({ id: newId('card'), category, name });
            } else {
              card.category = category;
              card.name = name;
            }
            saveNow();
            renderSettings();
            toast('已保存');
            return true;
          }
        }
      ]
    });
  }

  function archiveCardData(id) {
    const card = state.cards.find(c => c.id === id);
    if (!card) return;
    card.archived = true;
    card.archivedAt = todayISO();
  }

  function restoreCard(id) {
    const card = state.cards.find(c => c.id === id);
    if (!card) return;
    card.archived = false;
    card.archivedAt = '';
    saveNow();
    renderToday();
    renderSettings();
    toast(`已恢复「${card.name}」`);
  }

  function deleteCard(id) {
    const card = state.cards.find(c => c.id === id);
    if (!card) return;
    if (!confirm(`把「${card.name}」移出卡片列表？以前的勾选记录会保留。`)) return;
    archiveCardData(id);
    saveNow();
    renderSettings();
    toast('已移出列表，历史已保留');
  }

  // ---------- sheet ----------
  let lastFocus = null;
  function openSheet({ title, body, actions = [], onMount }) {
    const root = $('#sheetRoot');
    root.innerHTML = `
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-head">
          <div class="sheet-title">${esc(title)}</div>
          <button class="icon-btn" data-close aria-label="关闭">${ICON.x}</button>
        </div>
        <div class="sheet-body">${body}</div>
        <div class="sheet-actions">
          ${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-action="${i}">${esc(a.label)}</button>`).join('')}
        </div>
      </div>
    `;
    root.inert = false;
    root.classList.add('open');
    document.body.classList.add('sheet-open');
    lastFocus = document.activeElement;

    root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
    actions.forEach((action, i) => {
      const btn = root.querySelector(`[data-action="${i}"]`);
      if (!btn) return;
      btn.addEventListener('click', async () => {
        try {
          const keep = action.onClick ? await action.onClick() : true;
          if (keep !== false) closeSheet();
        } catch (err) {
          console.error(err);
          toast('出了点问题，再试一次');
        }
      });
    });
    if (onMount) onMount(root);
    setTimeout(() => {
      const first = root.querySelector('input:not([type=date]):not([type=file]), textarea, select');
      if (first && !('ontouchstart' in window)) first.focus({ preventScroll: true });
    }, 260);
  }

  function closeSheet() {
    const root = $('#sheetRoot');
    const wasOpen = root.classList.contains('open');
    root.classList.remove('open');
    root.inert = true;
    document.body.classList.remove('sheet-open');
    if (lastFocus && lastFocus.focus) {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    }
    lastFocus = null;
    if (wasOpen) renderCurrent();
  }

  // ---------- welcome ----------
  function openWelcome() {
    openSheet({
      title: '这是你的手机版',
      body: `
        <div class="welcome">
          <p>这里<strong>不抽卡</strong>。你做了哪张，就自己勾哪张。</p>
          <p>下面四个页面：<br>
            <b>今天</b> 勾选做了什么，写一句日常；<br>
            <b>笔叙</b> 输出 / 日常 / 摘录，三种分开写；<br>
            <b>睡眠</b> 自己记睡眠饮食；<br>
            <b>设置</b> 添加、恢复和管理卡片。</p>
          <p>正文边写边存，改动会自动保存在这台手机的浏览器里。点日期可以直接选过去的一天；点卡片名字可以看它以前勾选过哪些日期。</p>
          <p class="welcome-soft">删除卡片只会把它移出列表，以前的勾选和补充记录都会保留。</p>
          <p class="welcome-soft">想让手机和电脑共用一份数据，可在「设置 → 云同步」连接私人加密同步。</p>
        </div>
      `,
      actions: [{ label: '知道了', cls: 'btn primary', onClick: () => true }]
    });
  }

  // ---------- init ----------
  async function init() {
    applyTheme();
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    $$('.tab').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    $('#themeBtn').addEventListener('click', () => {
      const current = resolveTheme();
      state.settings.theme = current === 'dark' ? 'light' : 'dark';
      saveNow();
      applyTheme();
      if (currentTab === 'settings') renderSettings();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSheet();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) flushLocalAndBeacon();
      else if (cloudConfig) void syncCloud();
    });
    window.addEventListener('pagehide', flushLocalAndBeacon);
    window.addEventListener('beforeunload', flushLocalAndBeacon);
    window.addEventListener('online', () => {
      if (cloudConfig) scheduleCloudSync(100);
    });
    window.addEventListener('offline', () => {
      if (cloudConfig) setCloudStatus('offline', '等待联网');
    });
    setInterval(() => {
      if (!document.hidden && cloudConfig && !cloudSyncPromise) void syncCloud();
    }, 60000);

    const hydrated = await hydrateStoredState();
    await syncOnLoad();
    applyTheme();
    switchTab('today');
    if (cloudConfig) scheduleCloudSync(700);

    if (!hadStore && !hydrated) {
      await saveNow({ snapshot: true });
      setTimeout(() => {
        if (!$('#sheetRoot').classList.contains('open')) openWelcome();
      }, 500);
    } else {
      setSaveStatus(currentSaveText, currentSaveKind);
    }
  }

  document.addEventListener('DOMContentLoaded', () => { init(); });
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
