<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5f2ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="枝下青">
<title>枝下青</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --paper: #f5f2ec;
    --paper-2: #fbf9f4;
    --topbar: rgba(245, 242, 236, .96);
    --ink: #23261f;
    --ink-2: #4d5148;
    --muted: #85887e;
    --line: #e2ddd1;
    --line-strong: #cbc5b7;
    --accent: #2f5d57;
    --accent-2: #3f756d;
    --accent-soft: #e2ece8;
    --on-accent: #fbf9f4;
    --danger: #9a4f45;
    --wash: rgba(47, 93, 87, .07);
    --grain: rgba(60, 65, 58, .06);
    --shadow: 0 18px 50px rgba(35, 40, 32, .14);
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif;
  }

  html[data-theme="dark"] {
    --paper: #141715;
    --paper-2: #1b1f1c;
    --topbar: rgba(20, 23, 21, .96);
    --ink: #e9e7df;
    --ink-2: #c4c8be;
    --muted: #93978d;
    --line: #2c322d;
    --line-strong: #414942;
    --accent: #8fbdb3;
    --accent-2: #a6ccc3;
    --accent-soft: #22312d;
    --on-accent: #10201c;
    --danger: #d18b7f;
    --wash: rgba(143, 189, 179, .06);
    --grain: rgba(225, 230, 220, .05);
    --shadow: 0 18px 50px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--paper); }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--paper);
    background-image: radial-gradient(1000px 520px at 50% -8%, var(--wash), transparent 70%);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    overscroll-behavior-y: contain;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(var(--grain) .7px, transparent .7px);
    background-size: 5px 5px;
    opacity: .55;
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- top ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) 18px 10px;
    background: var(--topbar);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px;
    color: var(--accent);
    flex: 0 0 auto;
  }
  .brand-name {
    font-family: var(--serif);
    font-size: 20px;
    line-height: 1.1;
    letter-spacing: .08em;
  }
  .brand-sub {
    margin-top: 3px;
    font-size: 9.5px;
    line-height: 1;
    color: var(--muted);
    letter-spacing: .24em;
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .save-dot {
    font-size: 10px;
    color: var(--accent);
    letter-spacing: .08em;
    opacity: .78;
    transition: color .2s, opacity .2s;
    white-space: nowrap;
  }
  .save-dot[data-state="pending"] { opacity: 1; color: var(--muted); }
  .save-dot[data-state="error"] { opacity: 1; color: var(--danger); }
  .icon-btn {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--paper-2);
    color: var(--ink-2);
    padding: 0;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- layout ---------- */
  .main {
    flex: 1;
    padding: 6px 16px calc(92px + env(safe-area-inset-bottom));
  }
  .view { display: none; }
  .view.active { display: block; animation: rise .24s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin: 10px 2px 16px;
  }
  .page-title {
    margin: 0;
    font-family: var(--serif);
    font-size: 27px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .page-sub {
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: .02em;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 7px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--paper-2);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .btn.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
  }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: var(--line); }
  .link-btn {
    border: 0;
    background: none;
    color: var(--accent);
    font-size: 12px;
    padding: 4px 0;
    white-space: nowrap;
  }
  .empty {
    padding: 30px 16px;
    border: 1px dashed var(--line-strong);
    border-radius: 16px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    line-height: 1.8;
  }
  .loading { padding: 54px 0; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .2em; }
  .hint { margin: 8px 4px 0; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  .foot-line {
    margin: 28px 0 10px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: .14em;
    color: var(--muted);
  }

  /* ---------- today ---------- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    margin-bottom: 10px;
  }
  .date-center { text-align: center; min-width: 0; }
  .date-main {
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.3;
    letter-spacing: .03em;
    font-variant-numeric: tabular-nums;
  }
  .date-sub { margin-top: 1px; font-size: 10.5px; color: var(--muted); letter-spacing: .08em; }
  .date-btn {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink-2);
    padding: 0;
  }
  .date-btn svg { width: 17px; height: 17px; }
  .back-today { display: block; margin: -2px auto 12px; font-size: 12px; }
  .glance {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 6px 9px 13px;
    border: 1px dashed var(--line-strong);
    border-radius: 14px;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .glance b { color: var(--ink-2); font-weight: 500; }
  .glance .link-btn { margin-left: auto; padding-right: 8px; }
  .backup-nudge {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin: -2px 0 12px;
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11.5px;
    text-align: left;
  }
  .backup-nudge b { font-weight: 500; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; margin: 0 3px 14px; }
  .progress-track { flex: 1; height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .progress-text { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .group { margin-bottom: 15px; }
  .group-head { display: flex; align-items: center; gap: 8px; margin: 0 5px 7px; }
  .group-name { font-size: 10.5px; letter-spacing: .18em; color: var(--muted); white-space: nowrap; }
  .group-line { flex: 1; height: 1px; background: var(--line); }
  .group-count { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card-list {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    overflow: hidden;
  }
  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .card-row:last-child { border-bottom: 0; }
  .check {
    flex: 0 0 auto;
    width: 23px; height: 23px;
    margin-top: 1px;
    display: grid; place-items: center;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    background: transparent;
    padding: 0;
    transition: background .18s, border-color .18s;
  }
  .check svg { width: 13px; height: 13px; color: var(--on-accent); opacity: 0; transform: scale(.6); transition: opacity .18s, transform .18s; }
  .card-row.done .check { background: var(--accent); border-color: var(--accent); }
  .card-row.done .check svg { opacity: 1; transform: none; }
  .card-main { flex: 1; min-width: 0; }
  .card-name {
    display: block;
    width: 100%;
    border: 0;
    background: none;
    padding: 1px 0 0;
    text-align: left;
    font-size: 15.5px;
    line-height: 1.4;
    color: var(--ink);
  }
  .card-row.done .card-name { color: var(--ink-2); }
  .detail-input {
    display: block;
    width: 100%;
    margin-top: 7px;
    padding: 3px 0 3px;
    border: 0;
    border-bottom: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-2);
    font-size: 13px;
    outline: none;
  }
  .detail-input::placeholder { color: var(--muted); opacity: .7; }
  .detail-input:focus { border-bottom-color: var(--accent); }

  .note-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 5px 8px; }
  .note-label { font-size: 10.5px; letter-spacing: .18em; color: var(--muted); }
  .note-textarea {
    display: block;
    width: 100%;
    min-height: 112px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.85;
    resize: vertical;
    outline: none;
  }
  .note-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---------- diary ---------- */
  .search {
    display: block;
    width: 100%;
    margin-bottom: 13px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-2);
    color: var(--ink);
    font-size: 14px;
    outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .entry {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    text-align: left;
  }
  .entry:active { border-color: var(--line-strong); }
  .entry-date { margin-bottom: 5px; font-size: 10.5px; color: var(--muted); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .entry-excerpt {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.75;
    white-space: pre-wrap;
  }

  /* ---------- segmented ---------- */
  .segmented {
    display: flex;
    gap: 3px;
    padding: 4px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-2);
  }
  .segmented button {
    flex: 1;
    min-height: 34px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    padding: 6px 10px;
  }
  .segmented button.active { background: var(--accent); color: var(--on-accent); }

  /* ---------- sleep ---------- */
  .sleep-card {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper-2);
    text-align: left;
  }
  .sleep-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sleep-label { font-family: var(--serif); font-size: 16.5px; font-variant-numeric: tabular-nums; }
  .sleep-badge { flex: 0 0 auto; font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 9px; }
  .sleep-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 12px; margin-top: 8px; font-size: 12px; }
  .sleep-grid span { color: var(--muted); }
  .sleep-grid b { font-weight: 500; color: var(--ink-2); }

  /* ---------- settings ---------- */
  .section { margin-bottom: 23px; }
  .section-title { margin: 0 5px 9px; font-size: 10.5px; letter-spacing: .18em; color: var(--muted); }
  .panel { border: 1px solid var(--line); border-radius: 16px; background: var(--paper-2); overflow: hidden; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 13px 16px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    text-align: left;
  }
  .setting-row:last-child { border-bottom: 0; }
  .setting-row .label { display: block; font-size: 14px; line-height: 1.4; }
  .setting-row .desc { display: block; margin-top: 2px; font-size: 11px; line-height: 1.5; color: var(--muted); }
  .action-row { cursor: pointer; }
  .action-row:active { background: var(--accent-soft); }
  .chev { flex: 0 0 auto; font-size: 11.5px; color: var(--accent); }
  .cat-block { border-bottom: 1px solid var(--line); }
  .cat-block:last-of-type { border-bottom: 0; }
  .cat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 16px 7px;
    background: var(--paper);
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .16em;
  }
  .card-setting { padding-top: 10px; padding-bottom: 10px; }
  .row-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .mini {
    min-height: 30px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--paper);
    color: var(--ink-2);
    font-size: 11.5px;
  }
  .mini.danger { color: var(--danger); }
  .add-card-row { justify-content: center; }
  .add-card-row .btn { width: 100%; }
  .segmented.small { margin: 0; padding: 3px; flex: 0 0 auto; }
  .segmented.small button { min-height: 28px; padding: 5px 10px; font-size: 11.5px; }
  .danger .label, .setting-row.danger .label { color: var(--danger); }
  .save-health .save-state {
    flex: 0 0 auto;
    color: var(--accent);
    font-size: 11.5px;
  }
  .save-health .save-state[data-state="error"] { color: var(--danger); }
  .data-tools { border-top: 1px solid var(--line); }
  .data-tools summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 16px;
    list-style: none;
  }
  .data-tools summary::-webkit-details-marker { display: none; }
  .data-tools[open] summary { border-bottom: 1px solid var(--line); }
  .data-tools summary .label { display: block; font-size: 14px; line-height: 1.4; }
  .data-tools summary .desc { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.5; }
  .data-tools .setting-row { background: var(--paper); }
  .snapshot-list { display: grid; gap: 8px; }
  .snapshot-item {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    text-align: left;
  }
  .snapshot-item b { display: block; font-size: 13px; font-weight: 500; }
  .snapshot-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

  /* ---------- tabbar ---------- */
  .tabbar {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    z-index: 30;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: 100%;
    max-width: 640px;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--topbar);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 48px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font-size: 9.5px;
    letter-spacing: .04em;
  }
  .tab svg { width: 21px; height: 21px; }
  .tab.active { color: var(--accent); }
  .tab:active { background: var(--accent-soft); }

  /* ---------- sheet ---------- */
  #sheetRoot { position: fixed; inset: 0; z-index: 100; pointer-events: none; visibility: hidden; transition: visibility .28s; }
  #sheetRoot.open { pointer-events: auto; visibility: visible; }
  .sheet-backdrop {
    position: absolute; inset: 0;
    background: rgba(18, 22, 19, .45);
    opacity: 0;
    transition: opacity .22s;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  #sheetRoot.open .sheet-backdrop { opacity: 1; }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    max-height: 92vh;
    max-height: 92dvh;
    margin: 0 auto;
    border-radius: 22px 22px 0 0;
    background: var(--paper);
    box-shadow: var(--shadow);
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.22, .9, .3, 1);
  }
  #sheetRoot.open .sheet { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px 8px; }
  .sheet-title { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: .03em; }
  .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 18px 14px; }
  .sheet-actions {
    display: flex;
    gap: 9px;
    padding: 11px 18px calc(13px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--paper);
  }
  .sheet-actions .btn { flex: 1; min-height: 42px; font-size: 14px; }
  body.sheet-open { overflow: hidden; }

  .field { margin-bottom: 13px; }
  .field label { display: block; margin-bottom: 6px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .move-row { display: flex; gap: 8px; }
  .move-row .btn { flex: 1; min-height: 38px; }
  .input {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper-2);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    outline: none;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea.input { resize: vertical; line-height: 1.7; }
  .diary-text { min-height: 44vh; font-family: var(--serif); font-size: 16.5px; line-height: 1.85; }
  .backup-text {
    min-height: 38vh;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    font-size: 11.5px;
    line-height: 1.55;
  }
  .date-static {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink-2);
    font-size: 14px;
  }

<script>
(() => {
  'use strict';

  const SEED = {"version":2,"updatedAt":0,"createdAt":"2026-10-29","settings":{"theme":"auto","lastBackup":""},"cards":[{"id":"anchor_zitie","category":"锚点卡","name":"字帖"},{"id":"anchor_tingge","category":"锚点卡","name":"听歌"},{"id":"explore_soft","category":"探索卡","name":"软件"},{"id":"explore_hard","category":"探索卡","name":"硬件"},{"id":"build_struct","category":"建设卡","name":"结构力学"},{"id":"build_read","category":"建设卡","name":"阅读"},{"id":"ice_listen","category":"破冰卡","name":"听力"},{"id":"ice_write","category":"破冰卡","name":"作文"},{"id":"ice_translate","category":"破冰卡","name":"翻译"},{"id":"ice_speak","category":"破冰卡","name":"口语"},{"id":"push_vocab","category":"推进卡","name":"词库"},{"id":"expr_water","category":"表达卡","name":"水彩"},{"id":"expr_oil","category":"表达卡","name":"油画棒"},{"id":"expr_film","category":"表达卡","name":"电影"}],"days":{},"sleep":[]};
  const STORE = 'zhiqing.v1';
  const VERSION = 2;
  const DB_NAME = 'zhiqing.storage';
  const DB_VERSION = 1;
  const SNAPSHOT_LIMIT = 24;
  const SNAPSHOT_GAP = 60 * 1000;
  const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const NOTE_TYPES = [
    { key: 'output', label: '输出', hint: '主动写的文字', unit: '篇', placeholder: '主动写的文字。想法、一段话、一首歌…', empty: '主动写的文字，写一段就存下来。' },
    { key: 'daily', label: '日常', hint: '今天发生了什么', unit: '篇', placeholder: '今天发生了什么。', empty: '今天发生了什么，写一句也算。' },
    { key: 'quote', label: '摘录', hint: '碰到的喜欢的句子', unit: '条', placeholder: '碰到的喜欢的句子。可以顺手写下来源。', empty: '碰到喜欢的句子，就记下来。' }
  ];
  const emptyNotes = () => ({ output: '', daily: '', quote: '' });
  const noteText = (day, type) => (day && day.notes && typeof day.notes[type] === 'string') ? day.notes[type] : '';
  const hasAnyNote = day => !!(day && day.notes && Object.values(day.notes).some(v => (v || '').trim()));
  const API = false ? (() => {
    try {
      return (location.protocol === 'http:' || location.protocol === 'https:') ? '/api/data' : null;
    } catch (e) {
      return null;
    }
  })() : null;

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
    chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>'
  };

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const pad = n => String(n).padStart(2, '0');
  const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoDate(new Date());
  const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
  const fmtDate = (s, short = false) => { if (!s) return ''; const d = parseISO(s); return short ? `${d.getMonth() + 1}.${d.getDate()}` : `${d.getMonth() + 1}月${d.getDate()}日`; };
  const fmtFull = s => { const d = parseISO(s); return `${d.getMonth() + 1}月${d.getDate()}日 · ${WEEK[d.getDay()]}`; };
  const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoDate(d); };
  const nowStamp = () => { const d = new Date(); return `${isoDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const hasKey = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
  const newId = prefix => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

  // ---------- state ----------
  function normalize(s) {
    const base = clone(SEED);
    s = s && typeof s === 'object' && !Array.isArray(s) ? s : {};
    const out = {
      version: VERSION,
      updatedAt: Number(s.updatedAt) || 0,
      createdAt: s.createdAt || base.createdAt,
      settings: Object.assign({ theme: 'auto', lastBackup: '' }, base.settings || {}, s.settings || {}),
      cards: Array.isArray(s.cards) ? s.cards.filter(c => c && c.id && c.name && c.category) : clone(base.cards),
      days: s.days && typeof s.days === 'object' && !Array.isArray(s.days) ? s.days : {},
      sleep: Array.isArray(s.sleep) ? s.sleep : clone(base.sleep)
    };
    for (const key of Object.keys(out.days)) {
      const day = out.days[key];
      if (!day || typeof day !== 'object' || Array.isArray(day)) { delete out.days[key]; continue; }
      day.done = day.done && typeof day.done === 'object' && !Array.isArray(day.done) ? day.done : {};
      const notes = day.notes && typeof day.notes === 'object' && !Array.isArray(day.notes) ? day.notes : {};
      day.notes = {
        output: typeof notes.output === 'string' ? notes.output : '',
        daily: typeof notes.daily === 'string' ? notes.daily : '',
        quote: typeof notes.quote === 'string' ? notes.quote : ''
      };
      // 旧版本的一天一段笔叙，归到「日常」
      if (typeof day.note === 'string' && day.note.trim() && !day.notes.daily.trim()) {
        day.notes.daily = day.note;
      }
      delete day.note;
    }
    out.sleep = out.sleep.filter(s => s && s.id && /^\d{4}-\d{2}-\d{2}$/.test(String(s.date || '')));
    return out;
  }

  function loadState(raw) {
    try {
      if (raw === undefined) raw = localStorage.getItem(STORE);
      if (!raw) return clone(SEED);
      return normalize(JSON.parse(raw));
    } catch (e) {
      console.warn('读取数据失败', e);
      return clone(SEED);
    }
  }

  let storageDbPromise = null;
  let storageWriteChain = Promise.resolve();
  let lastSnapshotAt = 0;
  let lastSnapshotFingerprint = '';
  let saveMeta = { local: false, indexedDb: false, savedAt: 0, text: '已自动保存', kind: 'saved' };
  let currentSaveText = '已自动保存';
  let currentSaveKind = 'saved';

  function requestResult(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('IndexedDB request failed'));
    });
  }

  function transactionDone(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed'));
      tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
    });
  }

  function openStorageDb() {
    if (!('indexedDB' in window)) return Promise.resolve(null);
    if (storageDbPromise) return storageDbPromise;
    storageDbPromise = new Promise((resolve, reject) => {
      let request;
      try {
        request = indexedDB.open(DB_NAME, DB_VERSION);
      } catch (e) {
        reject(e);
        return;
      }
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains('state')) {
          db.createObjectStore('state', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('snapshots')) {
          const snapshots = db.createObjectStore('snapshots', { keyPath: 'id', autoIncrement: true });
          snapshots.createIndex('savedAt', 'savedAt');
        }
      };
      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => db.close();
        resolve(db);
      };
      request.onerror = () => reject(request.error || new Error('IndexedDB open failed'));
      request.onblocked = () => reject(new Error('IndexedDB blocked'));
    }).catch(err => {
      console.warn('备用存储不可用', err);
      storageDbPromise = null;
      return null;
    });
    return storageDbPromise;
  }

  async function readCurrentFromDb(db) {
    if (!db) return null;
    try {
      const tx = db.transaction('state', 'readonly');
      const record = await requestResult(tx.objectStore('state').get('current'));
      return record && record.data ? record : null;
    } catch (e) {
      return null;
    }
  }

  async function readLatestSnapshotFromDb(db) {
    if (!db) return null;
    try {
      const tx = db.transaction('snapshots', 'readonly');
      return await new Promise((resolve, reject) => {
        const request = tx.objectStore('snapshots').index('savedAt').openCursor(null, 'prev');
        request.onsuccess = () => {
          const cursor = request.result;
          resolve(cursor ? cursor.value : null);
        };
        request.onerror = () => reject(request.error);
      });
    } catch (e) {
      return null;
    }
  }

  function storageFingerprint(data) {
    const copy = Object.assign({}, data);
    delete copy.updatedAt;
    return JSON.stringify(copy);
  }

  async function trimSnapshots(db) {
    const tx = db.transaction('snapshots', 'readonly');
    const all = await requestResult(tx.objectStore('snapshots').getAll());
    if (all.length <= SNAPSHOT_LIMIT) return;
    const remove = all.slice(0, all.length - SNAPSHOT_LIMIT);
    const trimTx = db.transaction('snapshots', 'readwrite');
    const store = trimTx.objectStore('snapshots');
    for (const record of remove) store.delete(record.id);
    await transactionDone(trimTx);
  }

  async function writePersistentCopy(json, forceSnapshot = false) {
    const db = await openStorageDb();
    if (!db) return false;
    const data = JSON.parse(json);
    const now = Date.now();
    const fingerprint = storageFingerprint(data);
    const shouldSnapshot = fingerprint !== lastSnapshotFingerprint &&
      (forceSnapshot || now - lastSnapshotAt >= SNAPSHOT_GAP);
    try {
      const tx = db.transaction(['state', 'snapshots'], 'readwrite');
      tx.objectStore('state').put({ id: 'current', savedAt: now, updatedAt: Number(data.updatedAt) || 0, data });
      if (shouldSnapshot) {
        tx.objectStore('snapshots').add({
          savedAt: now,
          updatedAt: Number(data.updatedAt) || 0,
          fingerprint,
          data
        });
      }
      await transactionDone(tx);
      if (shouldSnapshot) {
        lastSnapshotAt = now;
        lastSnapshotFingerprint = fingerprint;
        await trimSnapshots(db);
      }
      return true;
    } catch (e) {
      console.warn('备用存储写入失败', e);
      return false;
    }
  }

  async function hydrateStoredState() {
    const db = await openStorageDb();
    if (!db) return false;
    const current = await readCurrentFromDb(db);
    const snapshot = await readLatestSnapshotFromDb(db);
    const candidates = [];
    for (const record of [current, snapshot]) {
      if (!record || !record.data) continue;
      try {
        candidates.push({
          record,
          data: normalize(record.data),
          updatedAt: Number(record.updatedAt) || 0,
          savedAt: Number(record.savedAt) || 0
        });
      } catch (e) {
        console.warn('备用存档损坏', e);
      }
    }
    candidates.sort((a, b) => (b.updatedAt - a.updatedAt) || (b.savedAt - a.savedAt));
    const fromDb = candidates[0] || null;
    if (fromDb && (!hadStore || fromDb.updatedAt > (state.updatedAt || 0))) {
      state = fromDb.data;
      try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
    }
    if (fromDb) saveMeta.savedAt = fromDb.savedAt || fromDb.updatedAt;
    lastSnapshotAt = Number(snapshot && snapshot.savedAt) || 0;
    lastSnapshotFingerprint = (snapshot && snapshot.fingerprint) || '';
    if (!current || !fromDb || (state.updatedAt || 0) > fromDb.updatedAt) {
      await writePersistentCopy(JSON.stringify(state), true);
    }
    return !!fromDb;
  }

  const hadStore = (() => { try { return !!localStorage.getItem(STORE); } catch (e) { return false; } })();
  let state = loadState();
  let currentTab = 'today';
  let viewDate = todayISO();
  let diarySearch = '';
  let diaryType = 'daily';
  let saveTimer = null;
  let toastTimer = null;
  let pushTimer = null;
  let serverAvailable = false;

  function writeLocalCopy(json) {
    try {
      localStorage.setItem(STORE, json);
      return true;
    } catch (e) {
      console.warn('本地保存失败', e);
      return false;
    }
  }
  function saveLocalOnly() {
    return writeLocalCopy(JSON.stringify(state));
  }
  function setSaveStatus(text, kind = 'saved') {
    currentSaveText = text;
    currentSaveKind = kind;
    const dot = $('#saveDot');
    if (dot) {
      dot.textContent = text;
      dot.dataset.state = kind;
    }
    const settingsState = $('#settingsSaveState');
    if (settingsState) {
      settingsState.textContent = text;
      settingsState.dataset.state = kind;
    }
    const summary = $('#storageSummary');
    if (summary) summary.textContent = storageSummaryText();
  }
  function storageSummaryText() {
    if (!saveMeta.savedAt) return saveMeta.indexedDb ? '本机双份自动保存已开启' : '本机自动保存';
    const d = new Date(saveMeta.savedAt);
    const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (saveMeta.local && saveMeta.indexedDb) return `本机两份都已保存 · ${time} · 自动保留最近 ${SNAPSHOT_LIMIT} 次`;
    if (saveMeta.local) return `已保存到浏览器 · ${time} · 本机仍有一份`;
    if (saveMeta.indexedDb) return `已保存到备用存储 · ${time}`;
    return '保存失败 · 请马上保存一份副本';
  }
  async function completeSave(localOk, indexedDbOk, json) {
    saveMeta = {
      local: !!localOk,
      indexedDb: !!indexedDbOk,
      savedAt: Date.now(),
      text: '',
      kind: 'saved'
    };
    const ok = localOk || indexedDbOk;
    const text = ok
      ? (localOk && indexedDbOk ? '已自动保存' : (localOk ? '已保存到本机' : '已保存到备用存储'))
      : '保存失败';
    saveMeta.text = text;
    saveMeta.kind = ok ? 'saved' : 'error';
    setSaveStatus(text, saveMeta.kind);
    if (!ok) toast('保存失败：请到设置保存副本');
    return ok;
  }
  function touch() {
    state.updatedAt = Date.now();
  }
  function pushServer(delay = 450) {
    if (!API || !serverAvailable) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state),
          cache: 'no-store'
        });
        if (res.status === 404 || res.status === 405) serverAvailable = false;
      } catch (e) {
        // 电脑没开或网络断了：手机本地照常保存
      }
    }, delay);
  }
  async function syncOnLoad() {
    if (!API) return;
    let res;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 1800);
      res = await fetch(API, { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(timer);
    } catch (e) {
      return;
    }
    if (res.ok) {
      try {
        const data = await res.json();
        const serverState = normalize(data);
        serverAvailable = true;
        if (!hadStore || (serverState.updatedAt || 0) > (state.updatedAt || 0)) {
          state = serverState;
          saveLocalOnly();
        } else {
          saveLocalOnly();
          pushServer(0);
        }
      } catch (e) {
        // 数据格式不对，先用手机上的
      }
    } else if (res.status === 404) {
      serverAvailable = true;
      saveLocalOnly();
      pushServer(0);
    }
  }
  function flushLocalAndBeacon() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
      touch();
    }
    const json = JSON.stringify(state);
    const localOk = writeLocalCopy(json);
    void writePersistentCopy(json, true).then(indexedDbOk => {
      if (localOk || indexedDbOk) {
        saveMeta.local = localOk;
        saveMeta.indexedDb = indexedDbOk;
        saveMeta.savedAt = Date.now();
      }
    });
    if (API && serverAvailable && navigator.sendBeacon) {
      try {
        navigator.sendBeacon(API, new Blob([json], { type: 'application/json' }));
      } catch (e) {}
    }
  }

  async function saveNow(options = {}) {
    clearTimeout(saveTimer);
    saveTimer = null;
    touch();
    const json = JSON.stringify(state);
    if (!options.silent) setSaveStatus('保存中…', 'pending');
    const localOk = writeLocalCopy(json);
    const indexedDbOk = await writePersistentCopy(json, !!options.snapshot);
    pushServer();
    return completeSave(localOk, indexedDbOk, json);
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    setSaveStatus('保存中…', 'pending');
    saveTimer = setTimeout(() => {
      saveTimer = null;
      void saveNow();
    }, 250);
  }
  function flashSaved() {
    setSaveStatus(saveMeta.text || '已自动保存', saveMeta.kind || 'saved');
  }
  function toast(msg) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
  }

  // ---------- theme ----------
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function resolveTheme() {
    return state.settings.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : state.settings.theme;
  }
  function applyTheme() {
    const theme = resolveTheme();
    document.documentElement.dataset.theme = theme;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#141715' : '#f5f2ec');
    const btn = $('#themeBtn');
    if (btn) btn.innerHTML = theme === 'dark' ? ICON.sun : ICON.moon;
  }
  function onSchemeChange() {
    if (state.settings.theme === 'auto') {
      applyTheme();
      if (currentTab === 'settings') renderSettings();
    }
  }
  if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
  else if (mq.addListener) mq.addListener(onSchemeChange);

  // ---------- helpers ----------
  function getDay(date, create = false) {
    if (!state.days[date]) {
      if (!create) return { done: {}, notes: emptyNotes() };
      state.days[date] = { done: {}, notes: emptyNotes() };
    }
    const day = state.days[date];
    if (!day.notes) day.notes = emptyNotes();
    return day;
  }
  function cleanupDay(date) {
    const day = state.days[date];
    if (!day) return;
    const hasDone = Object.keys(day.done || {}).length > 0;
    if (!hasDone && !hasAnyNote(day)) delete state.days[date];
  }
  function categoryList() {
    const base = ['锚点卡', '探索卡', '建设卡', '破冰卡', '推进卡', '表达卡'];
    const extra = [];
    for (const c of state.cards) {
      if (c.category && !base.includes(c.category) && !extra.includes(c.category)) extra.push(c.category);
    }
    return base.concat(extra);
  }
  function cardsIn(cat) { return state.cards.filter(c => c.category === cat); }
  function sleepLabel(date) {
    if (!date) return '—';
    const d = parseISO(date);
    const prev = new Date(d);
    prev.setDate(d.getDate() - 1);
    return `${prev.getMonth() + 1}.${prev.getDate()}→${d.getMonth() + 1}.${d.getDate()}`;
  }
  function sleepFor(date) { return state.sleep.find(s => s.date === date); }
  function sleepRows() { return state.sleep.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))); }
  function backupAgeDays() {
    const last = state.settings.lastBackup;
    if (!last) return Infinity;
    const d = parseISO(last);
    if (isNaN(d.getTime())) return Infinity;
    return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
  }
  function needsBackup() { return backupAgeDays() >= 7; }
  function diaryEntries(type) {
    return Object.entries(state.days)
      .filter(([, d]) => noteText(d, type).trim())
      .map(([date, d]) => ({ date, text: noteText(d, type).trim() }))
      .sort((a, b) => b.date.localeCompare(a.date));
  }
  function placeholderFor(card) {
    const map = {
      '建设卡': '页数 / 时长 / 进度',
      '推进卡': '范围 / 数量',
      '破冰卡': '套卷 / 句数 / 时长',
      '锚点卡': '时长 / 状态',
      '表达卡': '作品 / 时长',
      '探索卡': '做了什么'
    };
    return map[card.category] || '补充一点（可选）';
  }

  // ---------- navigation ----------
  function switchTab(tab) {
    currentTab = tab;
    $$('.view').forEach(v => v.classList.toggle('active', v.dataset.view === tab));
    $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    renderCurrent();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  function renderAll() {
    $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
    $$('.view').forEach(v => v.classList.toggle('active', v.dataset.view === currentTab));
    renderCurrent();
  }
  function renderCurrent() {
    if (currentTab === 'today') renderToday();
    else if (currentTab === 'diary') renderDiary();
    else if (currentTab === 'sleep') renderSleep();
    else if (currentTab === 'settings') renderSettings();
  }

  // ---------- today ----------
  function renderToday() {
    const day = getDay(viewDate);
    const totalCards = state.cards.length;
    const doneCount = state.cards.filter(c => hasKey(day.done, c.id)).length;
    const isToday = viewDate === todayISO();
    const sleep = sleepFor(viewDate);
    const groups = categoryList().map(cat => {
      const cards = cardsIn(cat);
      if (!cards.length) return '';
      const catDone = cards.filter(c => hasKey(day.done, c.id)).length;
      return `
        <div class="group">
          <div class="group-head">
            <span class="group-name">${esc(cat)}</span>
            <span class="group-line"></span>
            <span class="group-count">${catDone}/${cards.length}</span>
          </div>
          <div class="card-list">
            ${cards.map(card => {
              const done = hasKey(day.done, card.id);
              const detail = done ? (day.done[card.id] || '') : '';
              return `
                <div class="card-row ${done ? 'done' : ''}" data-card="${esc(card.id)}">
                  <button class="check" data-toggle="${esc(card.id)}" aria-label="${done ? '取消' : '勾选'}${esc(card.name)}" aria-pressed="${done}">${ICON.check}</button>
                  <div class="card-main">
                    <button class="card-name" data-toggle="${esc(card.id)}">${esc(card.name)}</button>
                    ${done ? `<input class="detail-input" data-detail="${esc(card.id)}" value="${esc(detail)}" placeholder="${esc(placeholderFor(card))}" enterkeyhint="done">` : ''}
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');

    const daily = noteText(day, 'daily');
    $('#view-today').innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="page-title">今天</h1>
          <div class="page-sub">只勾选真的做了的。空着也是记录。</div>
        </div>
      </div>
      <div class="date-nav">
        <button class="date-btn" data-day="-1" aria-label="前一天">${ICON.chevL}</button>
        <div class="date-center">
          <div class="date-main">${fmtFull(viewDate)}</div>
          <div class="date-sub">${isToday ? '今天' : (hasAnyNote(day) || doneCount ? '补记' : '空白')}</div>
        </div>
        <button class="date-btn" data-day="1" aria-label="后一天" ${isToday ? 'disabled' : ''}>${ICON.chevR}</button>
      </div>
      ${!isToday ? '<button class="btn ghost back-today" id="backToday">回到今天</button>' : ''}
      <div class="glance">
        ${sleep
          ? `昨夜 <b>${esc(sleep.total || sleep.night || '已记录')}</b> · 饮食 <b>${esc(sleep.meals || '—')}</b> 次`
          : '还没有记昨夜睡眠'}
        <button class="link-btn" data-go="sleep">${sleep ? '查看' : '去记录'}</button>
      </div>
      ${needsBackup() ? `<button class="backup-nudge" data-go="settings" data-scroll="data">
        <span>${state.settings.lastBackup ? `已经 ${backupAgeDays()} 天没备份` : '还没备份过'}</span>
        <b>去备份</b>
      </button>` : ''}
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${totalCards ? (doneCount / totalCards * 100) : 0}%"></div></div>
        <div class="progress-text">${doneCount}/${totalCards}</div>
      </div>
      ${groups || '<div class="empty">还没有卡片。去「设置」里添加。</div>'}
      <div class="note-head">
        <span class="note-label">今日日常</span>
        <button class="link-btn" data-go="diary" data-type="daily">笔叙 →</button>
      </div>
      <textarea class="note-textarea" id="todayNote" placeholder="今天发生了什么，想写就写。">${esc(daily)}</textarea>
      <div class="foot-line">${isToday ? '今天到这里就可以。' : ''}</div>
    `;

    $('#view-today').querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => toggleCard(btn.dataset.toggle));
    });
    $('#view-today').querySelectorAll('[data-detail]').forEach(inp => {
      inp.addEventListener('input', () => {
        const d = getDay(viewDate, true);
        d.done[inp.dataset.detail] = inp.value;
        scheduleSave();
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    });
    const noteEl = $('#todayNote');
    noteEl.addEventListener('input', () => {
      const d = getDay(viewDate, true);
      d.notes.daily = noteEl.value;
      cleanupDay(viewDate);
      scheduleSave();
    });
    $('#view-today').querySelectorAll('[data-day]').forEach(btn => {
      btn.addEventListener('click', () => {
        const n = Number(btn.dataset.day);
        if (n > 0 && viewDate >= todayISO()) return;
        viewDate = addDays(viewDate, n);
        renderToday();
      });
    });
    const back = $('#backToday');
    if (back) back.addEventListener('click', () => { viewDate = todayISO(); renderToday(); });
    $('#view-today').querySelectorAll('[data-go]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.type) diaryType = btn.dataset.type;
        switchTab(btn.dataset.go);
        if (btn.dataset.scroll) {
          setTimeout(() => {
            const target = document.querySelector('#exportJson');
            if (target) target.scrollIntoView({ block: 'center' });
          }, 60);
        }
      });
    });
  }

  function toggleCard(id) {
    const day = getDay(viewDate, true);
    if (hasKey(day.done, id)) delete day.done[id];
    else day.done[id] = '';
    cleanupDay(viewDate);
    saveNow();
    renderToday();
  }

  // ---------- diary ----------
  function renderDiary() {
    const info = NOTE_TYPES.find(t => t.key === diaryType) || NOTE_TYPES[1];
    const all = diaryEntries(diaryType);
    $('#view-diary').innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="page-title">笔叙</h1>
          <div class="page-sub">${all.length} ${info.unit} · ${info.hint}</div>
        </div>
        <button class="btn primary" id="newDiary">写一篇</button>
      </div>
      <div class="segmented">
        ${NOTE_TYPES.map(t => `<button data-dtype="${t.key}" class="${diaryType === t.key ? 'active' : ''}">${t.label} ${diaryEntries(t.key).length}</button>`).join('')}
      </div>
      <input class="search" id="diarySearch" placeholder="在「${info.label}」里找一句…" value="${esc(diarySearch)}" autocomplete="off">
      <div id="diaryList"></div>
    `;
    updateDiaryList();
    $('#newDiary').addEventListener('click', () => openDiaryEditor(todayISO(), diaryType));
    $('#view-diary').querySelectorAll('[data-dtype]').forEach(btn => {
      btn.addEventListener('click', () => {
        diaryType = btn.dataset.dtype;
        diarySearch = '';
        renderDiary();
      });
    });
    const search = $('#diarySearch');
    search.addEventListener('input', () => {
      diarySearch = search.value;
      updateDiaryList();
    });
    $('#diaryList').addEventListener('click', e => {
      const entry = e.target.closest('[data-entry]');
      if (entry) openDiaryEditor(entry.dataset.entry, diaryType);
    });
  }

  function updateDiaryList() {
    const info = NOTE_TYPES.find(t => t.key === diaryType) || NOTE_TYPES[1];
    const all = diaryEntries(diaryType);
    const q = diarySearch.trim().toLowerCase();
    const list = q
      ? all.filter(e => (e.text + ' ' + e.date + ' ' + fmtFull(e.date)).toLowerCase().includes(q))
      : all;
    const box = $('#diaryList');
    if (!box) return;
    box.innerHTML = list.length
      ? list.map(e => `
        <button class="entry" data-entry="${esc(e.date)}">
          <div class="entry-date">${fmtFull(e.date)}</div>
          <div class="entry-excerpt">${esc(e.text)}</div>
        </button>`).join('')
      : `<div class="empty">${q ? '没有找到。' : `${info.empty}`}</div>`;
  }

  function openDiaryEditor(date, type) {
    const info = NOTE_TYPES.find(t => t.key === type) || NOTE_TYPES[1];
    const moveTargets = NOTE_TYPES.filter(t => t.key !== info.key);
    let loadedDate = date;
    let loadedText = noteText(state.days[date], info.key);
    openSheet({
      title: `笔叙 · ${info.label}`,
      body: `
        <div class="field">
          <label>日期</label>
          <input class="input" type="date" id="dDate" value="${esc(date)}" max="${todayISO()}">
        </div>
        <div class="field">
          <label>${info.label}</label>
          <textarea class="input diary-text" id="dText" placeholder="${esc(info.placeholder)}">${esc(loadedText)}</textarea>
        </div>
        <div class="field">
          <label>移到</label>
          <div class="move-row">
            ${moveTargets.map(t => `<button type="button" class="btn ghost" data-move="${t.key}">${t.label}</button>`).join('')}
          </div>
        </div>
        <div class="hint sheet-hint">边写边存，不用点保存。换日期会切换到那天的${info.label}；清空文字并点「完成」才会删掉这篇。</div>
      `,
      actions: [
        {
          label: '完成',
          cls: 'btn primary',
          onClick: async () => {
            const chosen = $('#dDate').value || loadedDate;
            const text = $('#dText').value;
            if (!text.trim()) {
              const existing = noteText(state.days[chosen], info.key).trim();
              if (existing) {
                if (!confirm('这篇是空的，要删掉吗？')) return false;
                getDay(chosen).notes[info.key] = '';
                cleanupDay(chosen);
                await saveNow();
                renderDiary();
                toast('已删除');
                return true;
              }
              toast('没有内容，不新增');
              return true;
            }
            const day = getDay(chosen, true);
            day.notes[info.key] = text;
            cleanupDay(chosen);
            await saveNow();
            renderDiary();
            toast('已自动保存');
            return true;
          }
        }
      ],
      onMount: (root) => {
        const dateInput = $('#dDate');
        const textEl = $('#dText');
        const commitDraft = (chosen = dateInput.value || loadedDate) => {
          const text = textEl.value;
          if (!text.trim()) return false;
          const day = getDay(chosen, true);
          day.notes[info.key] = text;
          cleanupDay(chosen);
          scheduleSave();
          return true;
        };
        textEl.addEventListener('input', () => commitDraft());
        dateInput.addEventListener('change', () => {
          const next = dateInput.value;
          if (!next) return;
          if (textEl.value.trim()) commitDraft(loadedDate);
          loadedDate = next;
          loadedText = noteText(state.days[next], info.key);
          textEl.value = loadedText;
        });
        root.querySelectorAll('[data-move]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const toType = btn.dataset.move;
            const toInfo = NOTE_TYPES.find(t => t.key === toType);
            if (!toInfo) return;
            const chosen = dateInput.value || loadedDate;
            const text = textEl.value;
            if (!text.trim()) { toast('先写一点再移'); return; }
            const existing = noteText(state.days[chosen], toType).trim();
            let finalText = text;
            if (existing) {
              if (!confirm(`那天已经有「${toInfo.label}」了。要把这段接在后面吗？`)) return;
              finalText = existing + '\n\n' + text.trim();
            }
            const day = getDay(chosen, true);
            day.notes[toType] = finalText;
            day.notes[info.key] = '';
            cleanupDay(chosen);
            await saveNow();
            diaryType = toType;
            diarySearch = '';
            renderDiary();
            closeSheet();
            toast(`已移到「${toInfo.label}」`);
          });
        });
      }
    });
  }

  // ---------- sleep ----------
  function renderSleep() {
    const rows = sleepRows();
    $('#view-sleep').innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="page-title">睡眠饮食</h1>
          <div class="page-sub">原始数据，自己填 · ${rows.length} 条</div>
        </div>
        <button class="btn primary" id="newSleep">记录</button>
      </div>
      <div id="sleepList">
        ${rows.length ? rows.map(s => `
          <button class="sleep-card" data-sid="${esc(s.id)}">
            <div class="sleep-top">
              <span class="sleep-label">${esc(sleepLabel(s.date))}</span>
              <span class="sleep-badge">${esc(s.total || '—')}</span>
            </div>
            <div class="sleep-grid">
              <div><span>夜间</span> <b>${esc(s.night || '—')}</b></div>
              <div><span>补觉</span> <b>${esc(s.nap || '—')}</b></div>
              <div><span>饮食</span> <b>${esc(s.meals || '—')}</b>${s.meals && s.meals !== '—' ? ' 次' : ''}</div>
              <div><span>异常</span> <b>${esc(s.abnormal || '—')}</b></div>
            </div>
          </button>`).join('') : '<div class="empty">还没有记录。点「记录」写一条。</div>'}
      </div>
      <div class="hint">「日期」填醒来那天。比如 10.15→10.16，填 10 月 16 日。</div>
    `;
    $('#newSleep').addEventListener('click', () => openSleepEditor(null));
    $('#sleepList').addEventListener('click', e => {
      const card = e.target.closest('[data-sid]');
      if (!card) return;
      const item = state.sleep.find(s => s.id === card.dataset.sid);
      if (item) openSleepEditor(item);
    });
  }

  function openSleepEditor(item) {
    const isNew = !item;
    const date = item ? item.date : todayISO();
    let working = item;
    openSheet({
      title: isNew ? '记录睡眠饮食' : '编辑记录',
      body: `
        <div class="field">
          <label>日期（醒来那天）</label>
          <input class="input" type="date" id="sDate" value="${esc(date)}" max="${todayISO()}">
        </div>
        <div class="field">
          <label>夜间睡眠</label>
          <input class="input" id="sNight" value="${esc(item ? item.night : '')}" placeholder="例如 01:00–10:00，约 9h">
        </div>
        <div class="field">
          <label>白天补觉</label>
          <input class="input" id="sNap" value="${esc(item ? item.nap : '')}" placeholder="例如 2h；没有就空着">
        </div>
        <div class="field">
          <label>总睡眠（粗算）</label>
          <input class="input" id="sTotal" value="${esc(item ? item.total : '')}" placeholder="例如 约 11h">
        </div>
        <div class="field">
          <label>饮食次数</label>
          <input class="input" id="sMeals" value="${esc(item ? item.meals : '')}" placeholder="例如 2" inputmode="numeric">
        </div>
        <div class="field">
          <label>异常项 / 体感</label>
          <input class="input" id="sAbnormal" value="${esc(item ? item.abnormal : '')}" placeholder="例如 入睡困难、烦、无聊">
        </div>
      `,
      actions: [
        ...(isNew ? [] : [{
          label: '删除',
          cls: 'btn danger',
          onClick: () => {
            if (!confirm('删掉这条记录？')) return false;
            state.sleep = state.sleep.filter(s => s.id !== item.id);
            saveNow();
            renderSleep();
            toast('已删除');
            return true;
          }
        }]),
        {
          label: '完成',
          cls: 'btn primary',
          onClick: async () => {
            const chosen = $('#sDate').value;
            const night = $('#sNight').value.trim();
            const nap = $('#sNap').value.trim();
            const total = $('#sTotal').value.trim();
            const meals = $('#sMeals').value.trim();
            const abnormal = $('#sAbnormal').value.trim();
            if (!chosen) { toast('选一下日期'); return false; }
            if (!night && !nap && !total && !meals && !abnormal) { toast('至少写一点'); return false; }
            const dup = state.sleep.find(s => s.date === chosen && s.id !== (working && working.id));
            if (dup) {
              if (!confirm('那天已经有记录了，要替换掉原来的吗？')) return false;
              state.sleep = state.sleep.filter(s => s.id !== dup.id);
            }
            if (!working) {
              working = { id: newId('sleep'), date: chosen, night, nap, total, meals, abnormal };
              state.sleep.push(working);
            } else Object.assign(working, { date: chosen, night, nap, total, meals, abnormal });
            await saveNow();
            renderSleep();
            toast('已自动保存');
            return true;
          }
        }
      ],
      onMount: root => {
        const fields = ['sDate', 'sNight', 'sNap', 'sTotal', 'sMeals', 'sAbnormal'];
        const read = () => {
          const chosen = $('#sDate').value || date;
          return {
            date: chosen,
            night: $('#sNight').value.trim(),
            nap: $('#sNap').value.trim(),
            total: $('#sTotal').value.trim(),
            meals: $('#sMeals').value.trim(),
            abnormal: $('#sAbnormal').value.trim()
          };
        };
        const autoSave = () => {
          const values = read();
          if (!values.night && !values.nap && !values.total && !values.meals && !values.abnormal) return;
          const duplicate = state.sleep.find(s => s.date === values.date && s.id !== (working && working.id));
          if (duplicate) return;
          if (!working) {
            working = Object.assign({ id: newId('sleep') }, values);
            state.sleep.push(working);
          } else {
            Object.assign(working, values);
          }
          scheduleSave();
        };
        fields.forEach(id => {
          const field = root.querySelector(`#${id}`);
          if (field) field.addEventListener('input', autoSave);
          if (field) field.addEventListener('change', autoSave);
        });
      }
    });
  }

  // ---------- settings ----------
  function renderSettings() {
    const cats = categoryList();
    const theme = state.settings.theme;
    const backupStatus = state.settings.lastBackup
      ? `上次保存副本：${fmtDate(state.settings.lastBackup)}`
      : '还没单独保存过副本';
    $('#view-settings').innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="page-title">设置</h1>
          <div class="page-sub">卡片、备份、外观</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">卡片</div>
        <div class="panel">
          ${cats.map(cat => {
            const cards = cardsIn(cat);
            if (!cards.length) return '';
            return `
              <div class="cat-block">
                <div class="cat-head"><span>${esc(cat)}</span><span>${cards.length}</span></div>
                ${cards.map(card => `
                  <div class="setting-row card-setting">
                    <div class="label">${esc(card.name)}</div>
                    <div class="row-actions">
                      <button class="mini" data-edit-card="${esc(card.id)}">改</button>
                      <button class="mini danger" data-del-card="${esc(card.id)}">删</button>
                    </div>
                  </div>`).join('')}
              </div>`;
          }).join('')}
          <div class="setting-row add-card-row">
            <button class="btn ghost" id="addCard">＋ 添加卡片</button>

  function bindSettings() {
    const view = $('#view-settings');
    $('#addCard').addEventListener('click', () => openCardEditor(null));
    view.querySelectorAll('[data-edit-card]').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = state.cards.find(c => c.id === btn.dataset.editCard);
        if (card) openCardEditor(card);
      });
    });
    view.querySelectorAll('[data-del-card]').forEach(btn => {
      btn.addEventListener('click', () => deleteCard(btn.dataset.delCard));
    });
    view.querySelectorAll('#themeSeg [data-theme]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.settings.theme = btn.dataset.theme;
        saveNow();
        applyTheme();
        renderSettings();
      });
    });
    $('#exportJson').addEventListener('click', saveBackupCopy);
    $('#restoreAuto').addEventListener('click', openAutoArchive);
    $('#backupText').addEventListener('click', openBackupText);
    $('#importFile').addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          void restoreFromData(JSON.parse(reader.result)).catch(() => {
            toast('恢复失败，文件可能不完整');
          });
        } catch (err) {
          toast('这个文件读不出来，确认是 .json 备份吗');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
    $('#restoreText').addEventListener('click', openRestoreText);
    $('#showHelp').addEventListener('click', openWelcome);
    $('#exportMd').addEventListener('click', () => {
      download(`枝下青-导出-${todayISO()}.md`, buildMarkdown(), 'text/markdown');
      toast('已导出 Markdown');
    });
    $('#copyMd').addEventListener('click', async () => {
      const ok = await copyText(buildMarkdown());
      toast(ok ? 'Markdown 已复制' : '复制失败，试试导出 Markdown');
    });
    $('#resetAll').addEventListener('click', async () => {
      if (!confirm('清空全部数据，恢复成初始状态？')) return;
      if (!confirm('真的确定？自动存档也会一起清空。想保留就先保存一份副本。')) return;
      await clearPersistentStorage();
      try { localStorage.removeItem(STORE); } catch (e) {}
      state = loadState();
      viewDate = todayISO();
      diarySearch = '';
      diaryType = 'daily';
      await saveNow({ snapshot: true });
      applyTheme();
      renderAll();
      toast('已清空，回到初始状态');
    });
  }

  async function saveBackupCopy() {
    const text = JSON.stringify(state, null, 2);
    const filename = `枝下青-备份-${todayISO()}.json`;
    const blob = new Blob([text], { type: 'application/json' });
    let saved = false;

    if (navigator.share && typeof File === 'function') {
      const file = new File([blob], filename, { type: 'application/json' });
      const shareData = { title: '枝下青备份', text: '枝下青数据副本', files: [file] };
      if (!navigator.canShare || navigator.canShare(shareData)) {
        try {
          await navigator.share(shareData);
          saved = true;
        } catch (e) {
          if (e && e.name === 'AbortError') return false;
          console.warn('系统分享不可用，改为下载', e);
        }
      }
    }

    if (!saved) {
      download(filename, text, 'application/json');
      saved = true;
    }

    if (saved) {
      state.settings.lastBackup = todayISO();
      void saveNow({ snapshot: true });
      toast('副本已保存');
    }
    return saved;
  }

  async function loadSnapshots() {
    const db = await openStorageDb();
    if (!db) return [];
    try {
      const tx = db.transaction('snapshots', 'readonly');
      const all = await requestResult(tx.objectStore('snapshots').getAll());
      return all.sort((a, b) => b.savedAt - a.savedAt);
    } catch (e) {
      console.warn('读取自动存档失败', e);
      return [];
    }
  }

  function snapshotSummary(data) {
    const days = data && data.days ? Object.values(data.days) : [];
    const notes = days.reduce((sum, day) => sum + (day && day.notes
      ? Object.values(day.notes).filter(text => String(text || '').trim()).length
      : 0), 0);
    const done = days.reduce((sum, day) => sum + Object.keys((day && day.done) || {}).length, 0);
    return `${notes} 条笔叙 · ${done} 项勾选 · ${(data && data.sleep ? data.sleep.length : 0)} 条睡眠`;
  }

  async function openAutoArchive() {
    const snapshots = await loadSnapshots();
    openSheet({
      title: '自动存档',
      body: `
        ${snapshots.length ? `
          <div class="hint sheet-hint" style="margin:0 0 10px">每次有改动，都会自动留下历史点。恢复前会先保存现在的版本。</div>
          <div class="snapshot-list">
            ${snapshots.map(snapshot => {
              const date = new Date(snapshot.savedAt);
              const label = `${date.getMonth() + 1}月${date.getDate()}日 ${pad(date.getHours())}:${pad(date.getMinutes())}`;
              return `<button class="snapshot-item" data-snapshot="${snapshot.id}">
                <b>${esc(label)}</b>
                <span>${esc(snapshotSummary(snapshot.data))}</span>
              </button>`;
            }).join('')}
          </div>
        ` : '<div class="empty">还没有历史点。以后写了内容，会自动出现在这里。</div>'}
      `,
      actions: [{ label: '关闭', cls: 'btn ghost', onClick: () => true }],
      onMount: root => {
        root.querySelectorAll('[data-snapshot]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const record = snapshots.find(item => String(item.id) === btn.dataset.snapshot);
            if (!record || !record.data) return;
            if (!confirm('恢复到这次自动存档？现在的版本也会先存一份。')) return;
            await saveNow({ snapshot: true, silent: true });
            state = normalize(record.data);
            viewDate = todayISO();
            diarySearch = '';
            await saveNow({ snapshot: true, silent: true });
            applyTheme();
            renderAll();
            closeSheet();
            toast('已恢复自动存档');
          });
        });
      }
    });

  async function clearPersistentStorage() {
    const db = await openStorageDb();
    if (!db) return;
    try {
      const tx = db.transaction(['state', 'snapshots'], 'readwrite');
      tx.objectStore('state').clear();
      tx.objectStore('snapshots').clear();
      await transactionDone(tx);
      lastSnapshotAt = 0;
      lastSnapshotFingerprint = '';
    } catch (e) {
      console.warn('清空备用存储失败', e);
    }
  }

  function deleteCardData(id) {
    state.cards = state.cards.filter(c => c.id !== id);
    for (const day of Object.values(state.days)) {
      if (day && day.done) delete day.done[id];
    }
    for (const date of Object.keys(state.days)) cleanupDay(date);
  }

  function deleteCard(id) {
    const card = state.cards.find(c => c.id === id);
    if (!card) return;
    if (!confirm(`删掉「${card.name}」？已经勾过的记录也会一起删掉。`)) return;
    deleteCardData(id);
    saveNow();
    renderSettings();
    toast('已删除');
  }

  // ---------- export ----------
  function buildMarkdown() {
    const lines = [];
    lines.push('# 枝下青 · 导出');
    lines.push('');
    lines.push(`> 导出于 ${nowStamp()}`);
    lines.push('');

    const days = Object.entries(state.days)
      .filter(([, d]) => Object.keys(d.done || {}).length || hasAnyNote(d))
      .sort((a, b) => a[0].localeCompare(b[0]));
    if (days.length) {
      lines.push('## 调度与笔叙');
      lines.push('');
      for (const [date, day] of days) {
        lines.push(`### ${date}`);
        lines.push('');
        const done = state.cards.filter(c => hasKey(day.done, c.id));
        if (done.length) {
          lines.push('# 调度');
          lines.push('');
          for (const card of done) {
            const detail = String(day.done[card.id] || '').trim();
            lines.push(`- [x] ${card.category} ${card.name}${detail ? ' · ' + detail : ''}`);
          }
          lines.push('');
        }
        const notes = NOTE_TYPES.filter(t => noteText(day, t.key).trim());
        if (notes.length) {
          lines.push('# 笔叙');
          lines.push('');
          for (const t of notes) {
            lines.push(`## ${t.label}`);
            lines.push('');
            lines.push(noteText(day, t.key).trim());
            lines.push('');
          }
        }
      }
    }

    const sleeps = sleepRows().reverse();
    if (sleeps.length) {
      lines.push('## 睡眠饮食记录');
      lines.push('');
      lines.push('| 日期 | 夜间睡眠 | 白天补觉 | 总睡眠（粗算） | 饮食次数 | 异常项 |');
      lines.push('|---|---|---|---|---|---|');
      for (const s of sleeps) {
        lines.push(`| ${cell(sleepLabel(s.date))} | ${cell(s.night)} | ${cell(s.nap)} | ${cell(s.total)} | ${cell(s.meals)} | ${cell(s.abnormal)} |`);
      }
      lines.push('');
    }
    return lines.join('\n');
  }
  function cell(value) {
    return String(value || '—').replace(/\|/g, '｜').replace(/\r?\n/g, ' ');
  }

  function download(filename, text, type) {
    const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) {
      return false;
    }
  }

  async function restoreFromData(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data) || (!data.cards && !data.days)) {
      throw new Error('bad data');
    }
    if (!confirm('导入会覆盖现在的全部数据。继续吗？')) return false;
    state = normalize(data);
    viewDate = todayISO();
    await saveNow({ snapshot: true });
    applyTheme();
    renderAll();
    toast('已恢复备份');
    return true;
  }

  // 一键同步链接：数据放在 URL 的 #restore= 后面，不会发送到服务器/仓库
  async function restoreFromHash() {
    if (!location.hash.startsWith('#restore=')) return false;
    const raw = location.hash.slice('#restore='.length);
    history.replaceState(null, '', location.pathname + location.search);
    try {
      const b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
      const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
      const bin = Uint8Array.from(atob(b64 + pad), c => c.charCodeAt(0));
      let json;
      if ('DecompressionStream' in window) {
        const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
        json = await new Response(stream).text();
      } else {
        json = new TextDecoder().decode(bin);
      }
      const data = JSON.parse(json);
      state = normalize(data);
      viewDate = todayISO();
      await saveNow({ snapshot: true });
      applyTheme();
      toast('已从 zhiqing-system 同步');
      return true;
    } catch (e) {
      console.warn('restore link failed', e);
      toast('同步链接失败，请用「粘贴恢复」');
      return false;
    }
  }

  // ---------- sheet ----------
  let lastFocus = null;
  function openSheet({ title, body, actions = [], onMount }) {
    const root = $('#sheetRoot');
    root.innerHTML = `
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-head">
          <div class="sheet-title">${esc(title)}</div>
          <button class="icon-btn" data-close aria-label="关闭">${ICON.x}</button>
        </div>
        <div class="sheet-body">${body}</div>
        <div class="sheet-actions">
          ${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-action="${i}">${esc(a.label)}</button>`).join('')}
        </div>
      </div>
    `;
    root.inert = false;
    root.classList.add('open');
    document.body.classList.add('sheet-open');
    lastFocus = document.activeElement;

    root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
    actions.forEach((action, i) => {
      const btn = root.querySelector(`[data-action="${i}"]`);
      if (!btn) return;
      btn.addEventListener('click', async () => {
        try {
          const keep = action.onClick ? await action.onClick() : true;
          if (keep !== false) closeSheet();
        } catch (err) {
          console.error(err);
          toast('出了点问题，再试一次');
        }
      });
    });
    if (onMount) onMount(root);
    setTimeout(() => {
      const first = root.querySelector('input:not([type=date]):not([type=file]), textarea, select');
      if (first && !('ontouchstart' in window)) first.focus({ preventScroll: true });
    }, 260);
  }

  function closeSheet() {
    const root = $('#sheetRoot');
    root.classList.remove('open');
    root.inert = true;
    document.body.classList.remove('sheet-open');
    if (lastFocus && lastFocus.focus) {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    }
    lastFocus = null;
  }

    applyTheme();
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    $$('.tab').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    $('#themeBtn').addEventListener('click', () => {
      const current = resolveTheme();
      state.settings.theme = current === 'dark' ? 'light' : 'dark';
      saveNow();
      applyTheme();
      if (currentTab === 'settings') renderSettings();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSheet();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) flushLocalAndBeacon();
    });
    window.addEventListener('pagehide', flushLocalAndBeacon);
    window.addEventListener('beforeunload', flushLocalAndBeacon);

    const hydrated = await hydrateStoredState();
    const restored = await restoreFromHash();
    await syncOnLoad();
    applyTheme();
    switchTab('today');

    if (!hadStore && !hydrated && !restored) {
      await saveNow({ snapshot: true });
      setTimeout(() => {
        if (!$('#sheetRoot').classList.contains('open')) openWelcome();
      }, 500);
    } else {
      setSaveStatus(currentSaveText, currentSaveKind);
    }
  }

  document.addEventListener('DOMContentLoaded', () => { init(); });
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
